<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nhà Đầu Tư Tí Hon — game mô phỏng bất động sản</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="Nhà Đầu Tư Tí Hon — bạn là nhà đầu tư kiểu gì?">
<meta property="og:description" content="Game mô phỏng 3 phút: đọc tin, mua bán, vay, cho thuê và nhận danh hiệu.">
<style>
:root{--bg:#0f2e2a;--card:#16433d;--card2:#1d544c;--gold:#e7b84b;--up:#8fe3a1;--down:#ff9b8a;--tx:#f3f7f5}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
.wrap{max-width:560px;margin:auto;padding:12px 12px 110px}
.card{background:var(--card);border-radius:14px;padding:12px;margin:8px 0}
.top{display:flex;justify-content:space-between;gap:6px;font-size:.85em;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.top b{display:block;font-size:1.15em}
.news{background:linear-gradient(135deg,#2a5d55,#1d4a44);border-left:4px solid var(--gold)}
.src{font-size:.8em;opacity:.8;margin-top:4px}
.zone{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.zone .nm{font-weight:600}.zone small{opacity:.75}
.price{text-align:right;font-weight:700}.up{color:var(--up)}.down{color:var(--down)}.flat{color:#c9d6d2}
.acts{grid-column:1/3;display:flex;gap:6px}.acts button{flex:1;padding:8px 4px;font-size:.8em}
button{font:inherit;background:var(--gold);color:#1b1b1b;border:0;border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer}
button.alt{background:#2c6b62;color:#fff}button.ghost{background:transparent;color:var(--tx);text-decoration:underline;padding:6px}
button:disabled{opacity:.35;cursor:not-allowed}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0b2421;border-top:1px solid #2c6b62;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:9}
.bar:empty{display:none}.bar .main{flex:1;max-width:260px;font-size:1.05em}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:480px;width:100%;background:var(--card2);max-height:92vh;overflow:auto}
.tag{display:inline-block;font-size:.72em;background:#0b2421;border-radius:6px;padding:2px 6px;margin-left:4px}
.hero{display:block;width:100%;height:auto;aspect-ratio:1200/460;object-fit:cover;border-radius:10px;margin-bottom:8px;background:#2c6b62}
.warn{font-size:.75em;opacity:.65;text-align:center;margin:12px 0}
.row{display:flex;justify-content:space-between;padding:3px 0}
h1,h2,h3{margin:.3em 0}
/* bản đồ phân khu */
.map{position:relative;width:100%;aspect-ratio:366/430;border-radius:16px;overflow:hidden;background:#d7ead9;margin:8px 0 4px;user-select:none;-webkit-user-select:none}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile{position:absolute;background:#0f2e2aee;color:var(--tx);border-radius:10px;padding:3px 8px;box-shadow:0 3px 8px #0006;border:1.5px solid #ffffff22;display:flex;flex-direction:column;justify-content:center;cursor:pointer;line-height:1.25;-webkit-tap-highlight-color:transparent}
.tile b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .pr{font-size:12px;font-weight:600;white-space:nowrap}
.tile .pr i{font-style:normal;margin-left:3px}.tile .pr i.fl{font-size:10.5px;font-weight:500}
.tile:active{transform:scale(.97)}
.tile.sel{border-color:#fff}
.tile.hot{border:2px solid var(--gold);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px #e7b84b55,0 0 8px #e7b84b88}50%{box-shadow:0 0 0 5px #e7b84b88,0 0 18px #e7b84bdd}}
.own{position:absolute;top:-9px;right:-8px;background:var(--gold);color:#1b1b1b;border-radius:10px;font-weight:700;font-size:10.5px;padding:1px 6px;font-style:normal;box-shadow:0 1px 3px #0006}
.lock{position:absolute;top:-10px;left:-9px;font-size:11px;font-style:normal;background:#0b2421;border:1px solid var(--gold);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.hint{font-size:.75em;opacity:.8;text-align:center;margin:4px 0 8px}
.hint .g{color:var(--gold);font-weight:700}
/* bottom sheet */
.dim{position:fixed;inset:0;background:#0008;z-index:8}
.sheet{position:fixed;left:0;right:0;margin:0 auto;max-width:560px;bottom:var(--barh,64px);background:var(--card2);border-radius:18px 18px 0 0;padding:8px 14px 14px;box-shadow:0 -6px 20px #0008;z-index:10;max-height:calc(100vh - var(--barh,64px) - 40px);overflow:auto}
.dim.anim{animation:fade .2s ease-out}.sheet.anim{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.grab{width:40px;height:4px;border-radius:2px;background:#ffffff55;margin:0 auto 8px}
.sheet .x{position:absolute;right:8px;top:6px;background:transparent;color:var(--tx);font-size:18px;padding:4px 8px;opacity:.7}
.sheet .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-right:26px}
.sheet .hd b{font-size:17px}.sheet .hd small{font-size:12px;opacity:.8}
.spark{display:block;width:100%;height:auto;margin:8px 0 4px}
.chip{display:inline-block;font-size:11.5px;background:#0b2421;border-radius:6px;padding:3px 7px;margin:2px 4px 2px 0}
.chip.hotc{border:1px solid var(--gold)}
.sheet .acts{display:flex;gap:8px;margin-top:10px}.sheet .acts button{flex:1;font-size:13px;line-height:1.35;padding:9px 3px}.acts button small{display:block;font-size:12px;white-space:nowrap}.acts button small.why{white-space:normal;font-size:10.5px;font-weight:500;opacity:.9;margin-top:2px}.sheet .acts button.loanbuy{flex:1.45}.loanbuy small.why{margin:0 0 1px}
/* popup cuối quý */
.pnl{text-align:center;padding:4px 0 10px;margin-bottom:8px;border-bottom:1px solid #ffffff22}
.pnl small{display:block;font-size:.9em;opacity:.85}
.pnl .big{font-size:46px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.pnl .sub{font-size:.75em;opacity:.7;margin-top:2px}
.pnl .bd{font-size:.78em;opacity:.8;margin:3px 6px 0;line-height:1.45}.pnl .bd span{white-space:nowrap}
.zl{font-size:.8em;margin:-2px 0 6px;line-height:1.45}.zl span{white-space:nowrap}
.dnote{display:block;font-size:.78em;opacity:.8;margin:0 4px 6px}
/* v3: độ dài ván, vay ngân hàng */
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.chips.col{flex-direction:column}
.chipb{flex:1;min-width:56px;background:#0b2421;color:var(--tx);border:1.5px solid #2c6b62;padding:8px 4px;line-height:1.25;font-size:.9em}
.chipb small{display:block;font-size:11px;opacity:.75;font-weight:500}.chipb.on{background:var(--gold);color:#1b1b1b;border-color:var(--gold)}.chipb.on small{opacity:.85}
.chipb.pk{text-align:left;padding:8px 10px}
.note{display:block;opacity:.78;font-size:.78em;margin-top:6px;line-height:1.35}
.lab{font-size:.8em;opacity:.8;margin-top:10px}
.sum{background:#0b242199;border-radius:10px;padding:8px 10px;margin:10px 0 6px}.sum .row{align-items:baseline;gap:8px}.r{text-align:right}
.binfo{font-size:.78em;line-height:1.2;display:flex;flex-direction:column;justify-content:center;padding:0 6px;min-width:112px;opacity:.95}.binfo b{font-size:1.2em;color:var(--gold)}
.pf .pfh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.pf .pfh small{opacity:.75;font-size:.75em}
.pfrow,.urow{background:#0b242199;border-radius:10px;padding:7px 9px;margin-top:6px;font-size:.85em;line-height:1.35}.pfrow{cursor:pointer}
.pfrow .l1,.urow .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.pfrow .l1 small,.urow .l1 small{opacity:.8;font-size:.85em;text-align:right}
.l2{font-weight:600}.l3{font-size:.85em;opacity:.85;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 6px}.l3 b{color:var(--gold);font-weight:600}
.urow{font-size:.82em}.units{margin-top:4px}
button.mini{background:#2c6b62;color:#fff;font-size:11.5px;padding:5px 8px;border-radius:8px;flex:none}
.acts.col{flex-direction:column;gap:2px}.sheet .acts button.buyb{flex:none;width:100%;font-size:14px;padding:10px 8px}.sheet .acts button.buyb small{white-space:normal}.acts button small.det{white-space:normal;font-size:10.5px;font-weight:500;opacity:.9}
button.ghost.cfg{font-size:12.5px;padding:4px;opacity:.9}
.note2{font-size:.85em;background:#0b242199;border-radius:8px;padding:6px 8px;margin:6px 0}.promo-end{border-left:3px solid var(--gold)}.firesale{border-left:3px solid var(--down)}
.res .vs{margin-top:4px;font-weight:600}.compact .one{margin:6px 0;font-size:.95em}
.res{text-align:center}.res .big{font-size:40px;font-weight:800}
.lesson{display:flex;gap:8px;align-items:flex-start;font-size:.95em;line-height:1.4;border-left:4px solid var(--gold)}.lesson i{font-style:normal}
.mw{display:inline-block;margin-top:6px;font-size:.78em;font-weight:600;background:#0b2421;border:1px solid #ffffff33;border-radius:6px;padding:2px 7px}
.tips{display:flex;flex-direction:column;gap:4px;margin:2px 0 8px}.tips span{font-size:.8em;background:#16433d;border-radius:8px;padding:5px 9px;line-height:1.3}
.rulesb{display:block;margin:0 auto 8px;font-size:.8em;padding:5px 12px;background:#2c6b62;color:#fff}
#rules ul{padding-left:18px;margin:6px 0;font-size:.9em;line-height:1.45}#rules li{margin:3px 0}#rules .warn{text-align:left;margin:8px 0}
#buyp .acts,#prep .acts{display:flex;gap:8px;margin-top:8px}#buyp .acts button{flex:1}#prep .acts.col button{width:100%;margin:3px 0}
</style></head><body><div class="wrap" id="app"></div><div id="bar" class="bar"></div><div id="sheet"></div><div id="modal"></div>
<script src="engine.js"></script>
<script>
let D,G,sel=null,sheetAnim=false,selQ=null,BP=null;const E=Engine;
const $=(id,h)=>document.getElementById(id).innerHTML=h;
const fmt=n=>(n<0?'-':'')+Math.round(Math.abs(n)).toLocaleString('vi-VN')+' tr';
const sgn=n=>{const v=Math.round(n);return (v>0?'+':v<0?'\u2212':'')+Math.abs(v).toLocaleString('vi-VN')+' tr'};
const flat=n=>Math.abs(+n.toFixed(1))===0; // làm tròn ra 0,0% => đứng giá
const pc=n=>flat(n)?'đứng giá':(n>=0?'▲ +':'▼ \u2212')+Math.abs(n).toFixed(1).replace('.',',')+'%'; // vd ▲ +2,9% / ▼ −0,5%
const chc=n=>flat(n)?'flat':n>=0?'up':'down';
const pr=n=>(Math.round(n*100)/100).toLocaleString('vi-VN')+'%'; // lãi suất, vd 9,5%
const mTxt=n=>{const v=Math.abs(n);return (v>0&&v<10?(Math.round(v*10)/10):Math.round(v)).toLocaleString('vi-VN')+' tr'}; // số tiền hằng tháng
const vol=r=>r<0.3?'Biến động thấp':r<0.5?'Biến động vừa':'Biến động cao';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){for(const f of['data/game-data.json','data/sample-data.json']){try{const r=await fetch(f,{cache:'no-cache'});if(r.ok){D=await r.json();return}}catch(e){}}}
function lenOpts(){return E.quarterOptions(D)}
function getLen(){const o=lenOpts(),s=+localStorage.bdsLen,d=(D.rules||{}).quarters;return o.includes(s)?s:o.includes(d)?d:o[0]}
function setLen(q){selQ=q;try{localStorage.bdsLen=q}catch(e){}document.querySelectorAll('#lenChips button').forEach(b=>b.classList.toggle('on',+b.dataset.q===q));const t=document.getElementById('introQ');if(t)t.textContent=q+' quý ('+q/4+' năm)'}
function start(){sel=null;BP=null;selQ=getLen();$('bar','');$('modal','');$('sheet','');
 const best=localStorage.bdsBestAnn;
 $('app',`<h1>Nhà Đầu Tư Tí Hon</h1><div class="card">Bạn có <b id="introQ">${selQ} quý (${selQ/4} năm)</b> để làm giàu. Mỗi quý có một tin tức, nhưng <b>tin chưa chắc đã đúng</b>: hãy xem nguồn tin rồi quyết định mua (có thể vay ngân hàng), bán hay cho thuê. Chốt quý xong mới biết tin thật hay giả.</div>
 <div class="card"><b>Độ dài ván</b><div class="chips" id="lenChips">${lenOpts().map(q=>`<button class="chipb${q===selQ?' on':''}" data-q="${q}" onclick="setLen(${q})">${q} quý<small>${q/4} năm</small></button>`).join('')}</div><small class="note">Ván dài có thêm tin tức, tình huống, và đủ thời gian để khoản vay hết ưu đãi rồi thả nổi lãi.</small></div>`+
 D.projects.map(p=>`<div class="card">${p.image?`<img class="hero" src="${p.image}" alt="${esc(p.name)}">`:''}<b>${p.name}</b><br><small>${p.tagline||''} · Vốn ${fmt(p.startCapital)}</small><br><button style="margin-top:8px" data-pick="${p.id}" onclick="pick('${p.id}')">Chơi dự án này</button></div>`).join('')+
 (best?`<p class="warn">Kỷ lục của bạn: ≈ ${String(best).replace('.',',')}%/năm</p>`:''))}
/* bộ đếm sự kiện ẩn danh (start/finish/zalo/replay): chỉ gửi từ vinhomes.space, không cookie/ID; lỗi thì bỏ qua.
   Tắt khi test: ?test=1 hoặc ?notrack (notrack được nhớ trên máy này; ?notrack=0 để bật lại). */
const TRACK=(()=>{try{const h=location.hostname,q=new URLSearchParams(location.search);
 if(q.has('notrack')){if(q.get('notrack')==='0')localStorage.removeItem('bdsNoTrack');else localStorage.bdsNoTrack='1'}
 return (h==='vinhomes.space'||h==='www.vinhomes.space')&&!q.has('test')&&!q.has('notrack')&&!localStorage.bdsNoTrack}catch(e){return false}})();
window._evLog=[];
function track(e,x){const p=G&&G.p?G.p.id:'';let s='e='+e+(p?'&p='+p:'');if(x)for(const k in x)s+='&'+k+'='+encodeURIComponent(x[k]);
 window._evLog.push(e+(p?':'+p:'')+(x&&x.q?':q'+x.q:''));if(!TRACK)return;
 try{const u='/api/ev?'+s;if(!(navigator.sendBeacon&&navigator.sendBeacon(u)))fetch(u,{method:'POST',keepalive:true}).catch(()=>{})}catch(err){}}
function pick(id){G=E.newGame(D,id,undefined,{quarters:selQ||getLen()});sel=null;BP=null;track('start',{q:G.totalQ});draw()}
// tên ngắn cho ô trên bản đồ
function short(z){if(z.short)return z.short;let n=z.name.replace(/^(Khu|Dãy|Phân khu)\s+/i,'');n=n[0].toUpperCase()+n.slice(1);
 if(n.length>17){let o='';for(const w of n.split(' ')){if((o+' '+w).trim().length>17)break;o=(o+' '+w).trim()}n=o}
 return n.replace(/\s+(du|mặt|ven|gần|khu|của)$/i,'')}
const own=id=>G.units.filter(u=>u.zone===id),free=id=>own(id).filter(u=>!E.locked(G,u));
const leasing=id=>own(id).filter(u=>u.leaseUntil&&u.leaseUntil>G.round);
const mwNow=()=>E.marketWide(G,G.ev); // tin ảnh hưởng toàn thị trường: không tô viền vàng ô nào
const hot=z=>!mwNow()&&E.hits(G.ev,z);
const rentTxt=(v,q)=>`+${fmt(v)} trong ${q} quý`;

/* ---------- bản đồ ---------- */
const MW=366,MH=430,X=p=>p*MW/100,Y=p=>p*MH/100;
const TW=38,TH=12; // kích thước ô mặc định (% bản đồ) khi dữ liệu không có wPct/hPct
function rectOf(z){const m=z.map;return {x:+m.xPct,y:+m.yPct,w:+(m.wPct||TW),h:+(m.hPct||TH)}}
const hitR=(a,b,pad=0)=>a.x<b.x+b.w+pad&&b.x<a.x+a.w+pad&&a.y<b.y+b.h+pad&&b.y<a.y+a.h+pad;
function kindOf(l){l=l.toLowerCase();return /rừng/.test(l)?'forest':/biển|vịnh|sông/.test(l)?'sea':/hồ/.test(l)?'lake':/công viên|park/.test(l)?'park':/đại lộ|đường|trục/.test(l)?'road':'land'}
function labelBox(t,cx,cy,fs){const w=t.length*fs*.56/MW*100,h=fs*1.3/MH*100;return {x:cx-w/2,y:cy-h/2,w,h}}
// chọn vị trí nhãn không đè lên ô phân khu
function place(t,cands,rects,fs){for(const [cx,cy] of cands){const b=labelBox(t,cx,cy,fs);if(b.x>=1&&b.x+b.w<=99&&!rects.some(r=>hitR(b,r,1.5)))return [cx,cy]}return cands[0]}
function label(t,cx,cy,fill,halo,fs=11){return `<text class="flabel" x="${X(cx)}" y="${Y(cy)}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" font-weight="600" fill="${fill}" stroke="${halo}" stroke-width="3" paint-order="stroke" font-family="system-ui,sans-serif">${esc(t)}</text>`}
const PARCEL=[['#b9d8c4','#6fa889'],['#c9d9b0','#8fa86f'],['#e9d8a8','#c4a55a'],['#bfe0e6','#6aa9b8']];
function mapSVG(zs){
 const R=zs.map(rectOf),rects=R.map(r=>({x:r.x-2,y:r.y-2.5,w:r.w+4,h:r.h+4.5})); // tính cả huy hiệu ở góc
 const maxB=Math.max(...R.map(r=>r.y+r.h)),minT=Math.min(...R.map(r=>r.y));
 let bg='',fg='',ov='',lab='';
 const feats=(G.p.mapFeatures||[]).map(f=>({...f,kind:kindOf(f.label)}));
 const order={park:0,land:0,forest:1,road:2,sea:3,lake:4};feats.sort((a,b)=>order[a.kind]-order[b.kind]);
 // lưới đường mờ giữa các ô
 bg+=`<path d="M${X(50)} ${Y(Math.max(minT-6,0))} V${Y(Math.min(maxB+4,100))}" stroke="#ffffffaa" stroke-width="7"/>`;
 feats.forEach(f=>{const k=f.kind,a=f.area||'center';
  if(k==='forest'||(k==='land'&&a==='top')){const b=Math.max(7,Math.min(12,minT-12));
   bg+=`<path d="M0 0 H${MW} V${Y(b)} Q${X(80)} ${Y(b+4)} ${X(60)} ${Y(b+1)} T${X(22)} ${Y(b+2)} T0 ${Y(b)}Z" fill="#9fcf9a"/>`;
   for(let i=0;i<9;i++)bg+=`<circle cx="${X(6+i*11)}" cy="${Y(b-1+(i%2)*1.5)}" r="${7+(i%3)*2}" fill="#7fb77e"/>`;
   bg+=`<path d="M0 ${Y(b+5)} Q${X(25)} ${Y(b+7.5)} ${X(50)} ${Y(b+5.5)} T${MW} ${Y(b+6)}" stroke="#8cc6d9" stroke-width="8" fill="none"/>`;
   lab+=label(f.label,Math.max(4,labelBox(f.label,0,0,11).w/2+3),b/2,'#2f6b3a','#d6efd4cc')}
  else if(k==='sea'){const t=Math.max(70,Math.min(90,maxB+8));
   bg+=`<path d="M0 ${Y(t)} Q${X(25)} ${Y(t-6)} ${X(50)} ${Y(t-2)} T${MW} ${Y(t-4)} V${MH} H0Z" fill="#f2e2b3"/><path d="M0 ${Y(t+2)} Q${X(25)} ${Y(t-4)} ${X(50)} ${Y(t)} T${MW} ${Y(t-2)} V${MH} H0Z" fill="url(#sea)"/><path d="M0 ${Y(t+2)} Q${X(25)} ${Y(t-4)} ${X(50)} ${Y(t)} T${MW} ${Y(t-2)} V${MH} H0Z" fill="url(#wave)"/>`;
   lab+=label(f.label,100-labelBox(f.label,0,0,12).w/2-4,t+(100-t)*.62,'#ffffff','#2f7fa3aa',12)}
  else if(k==='park'){const top=Math.max(...R.filter(r=>r.y<35).map(r=>r.y+r.h),20)+3,bot=Math.min(...R.filter(r=>r.y>60).map(r=>r.y),80)-3;
   bg+=`<rect x="${X(4)}" y="${Y(top)}" width="${X(92)}" height="${Y(bot-top)}" rx="22" fill="#a9d9a0" stroke="#86c07c" stroke-width="2"/>`;
   const cy=(top+bot)/2,[lx,ly]=place(f.label,[[50,cy],[30,cy],[28,cy-5],[28,cy+5],[70,cy],[50,top+4],[50,bot-4]],rects,11);
   const lb=labelBox(f.label,lx,ly,11);

 <div>${hot(z)?'<span class="chip hotc">📰 Tin quý này nhắc tới phân khu này</span>':mwNow()?'<span class="chip">🌐 Tin quý này ảnh hưởng toàn thị trường</span>':''}<span class="chip">Bạn đang giữ ${o.length} căn</span>${ls.length?`<span class="chip">🔒 còn nhận ${rentTxt(left,lq)}</span>`:''}${lk.length?`<span class="chip">⛓ ${lk.length} căn khóa chuyển nhượng · còn ${Math.max(...lk.map(u=>u.lockUntil-G.round))} quý</span>`:''}${G.perks.discount?`<span class="chip">🎟️ Mua rẻ hơn ${G.perks.discount.pct}%, khóa ${G.perks.discount.lock} quý</span>`:''}</div>
 ${units?`<div class="units">${units}</div>`:''}
 <div class="acts col">${buyB}<button class="ghost cfg" id="buycfg" onclick="openBuy('${z.id}')">Tùy chỉnh khoản vay (tỷ lệ vay, thời hạn, gói) ›</button></div>
 <div class="acts"><button data-act="sell" class="alt" ${sq&&sq.ok?'':'disabled'} onclick="act('sell','${z.id}')">Bán, nhận ${sq?fmt(sq.net):''}<small class="det">${sellDet}</small>${!tu?why(z,'sell'):(!sq.ok?'<small class="why">Tiền bán không đủ trả nợ ngân hàng</small>':'')}</button>
 <button data-act="rent" class="alt" ${canRent?'':'disabled'} onclick="act('rent','${z.id}')">Cho thuê<small>${rentTxt(E.rentQuote(G,z),E.LEASE_Q)}</small>${canRent?'':why(z,'rent')}</button></div></div>`)}
function buyWhy(q){return q.why==='down'?`Thiếu ${fmt(q.down-G.cash)} tiền trả trước (cần ${fmt(q.down)})`:`Cần giữ lại ~${fmt(q.reserve)} để trả góp ${q.reserveQuarters>1?q.reserveQuarters+' quý':'1 quý'} (tính theo lãi thả nổi)`}
function why(z,k){const o=own(z.id);if(!o.length)return '<small class="why">Chưa có căn</small>';
 const ls=o.filter(u=>u.leaseUntil&&u.leaseUntil>G.round),lk=o.filter(u=>E.locked(G,u));
 if(k==='rent'&&ls.length===o.length)return `<small class="why">Đang cho thuê, còn ${Math.min(...ls.map(u=>u.leaseUntil-G.round))} quý</small>`;
 if(!lk.length)return '';const n=Math.min(...lk.map(u=>u.lockUntil-G.round));
 return `<small class="why">${lk.some(u=>u.leaseUntil)?'Đang cho thuê':'Đang khóa'}, mở lại sau ${n} quý</small>`}
/* ---------- bảng tùy chỉnh khoản vay ---------- */
function ltvChoices(){const m=E.maxLtv(G);return [...new Set(G.M.ltvOptionsPct.filter(x=>x<=m).concat([m]))].sort((a,b)=>a-b)}
function devPkg(){const d=G.perks.devSupport;return {id:E.DEV_ID,name:'Hỗ trợ lãi suất của chủ đầu tư',bank:`giá +${pr(d.priceMarkupPct||0)}${d.grace?', ân hạn gốc':''}`,promoRatePctYear:d.customerRatePctYear||0,promoMonths:d.months||0,floatMarginPct:G.M.packages[0].floatMarginPct}}
function openBuy(id){const M=G.M;BP={id,ltv:Math.min(M.defaultLtvPct,E.maxLtv(G)),term:M.defaultTermYears,pkg:G.perks.devSupport?E.DEV_ID:M.packages[0].id};drawBuy()}
function closeModal(){BP=null;$('modal','')}
function drawBuy(){if(!BP)return;const M=G.M,z=E.zone(G,BP.id),q=E.buyQuote(G,BP.id,{ltvPct:BP.ltv,termYears:BP.term,pkgId:BP.pkg});
 const style=M.repayment==='annuity'?'góp đều hằng tháng':'gốc chia đều, lãi tính trên dư nợ giảm dần';
 $('modal',`<div class="modal" id="buyp"><div class="card"><h3>🏦 Mua ${esc(z.name)}</h3><div class="row"><span>Giá mua</span><b>${fmt(q.price)}</b></div>
 <div class="lab">Tỷ lệ vay</div>${q.capped?`<small class="note">Ngân hàng đang siết tín dụng: vay tối đa ${q.maxLtvPct}% (bình thường ${M.maxLtvPct}%).</small>`:''}<div class="chips">${ltvChoices().map(v=>`<button class="chipb${v===q.ltvPct?' on':''}" data-ltv="${v}" onclick="BP.ltv=${v};drawBuy()">${v?v+'%':'Không vay'}</button>`).join('')}</div>
 ${q.loan?`<div class="lab">Thời hạn vay</div><div class="chips">${M.termYearsOptions.map(t=>`<button class="chipb${t===q.termYears?' on':''}" data-term="${t}" onclick="BP.term=${t};drawBuy()">${t} năm</button>`).join('')}</div>
 <div class="lab">Gói vay</div><div class="chips col">${(G.perks.devSupport?[devPkg()]:[]).concat(M.packages).map(k=>`<button class="chipb pk${k.id===q.pkg.id?' on':''}" data-pkg="${k.id}" onclick="BP.pkg='${k.id}';drawBuy()">${esc(k.name)}<small>${k.bank?esc(k.bank)+' · ':''}${pr(k.promoRatePctYear)} × ${k.promoMonths} tháng, rồi cơ sở + ${pr(k.floatMarginPct)}</small></button>`).join('')}</div>`:''}
 <div class="sum"><div class="row"><span>Tiền mặt trả trước</span><b>${fmt(q.down)}</b></div>
 ${q.loan?`<div class="row"><span>Số vay</span><b>${fmt(q.loan)}</b></div>
 <div class="row"><span>Lãi suất</span><b>${pr(q.promoRate)}/năm trong ${q.promoMonths} tháng</b></div><small class="note" style="display:block;text-align:right">rồi thả nổi ≈ ${pr(q.floatRate)}/năm (lãi cơ sở ${pr(q.base)} + biên độ ${pr(q.margin)})</small>
 ${q.reserve>0?`<div class="row"><span>Cần giữ lại để góp 1 quý</span><b>${fmt(q.reserve)}</b></div>`:''}
<div class="row"><span>Trả góp tháng đầu</span><b id="bpm">≈ ${mTxt(q.firstMonth.total)}/tháng</b></div>
 <small class="note">Gốc ${mTxt(q.firstMonth.p)} + lãi ${mTxt(q.firstMonth.i)} (${style}${M.graceMonths?`, ân hạn gốc ${M.graceMonths} tháng`:''}). Mỗi quý trừ 3 tháng trả góp, quý đầu ≈ ${fmt(q.firstQuarter.total)}. Bán căn hoặc trả nợ trước hạn: phạt ${M.prepayPenaltyPctByYear.map(pr).join(' / ')} dư nợ theo năm vay thứ 1 / 2 / …</small>`:''}</div>
 ${q.ok?'':`<p class="down" id="bpshort">${buyWhy(q)}. ${q.why==='down'?'Hãy tăng tỷ lệ vay hoặc bán bớt căn khác.':'Hãy giảm tỷ lệ vay, chọn căn rẻ hơn hoặc bán bớt căn khác.'}</p>`}
 <div class="acts"><button id="buyok" ${q.ok?'':'disabled'} onclick="confirmBuy()">Mua${q.loan?' · vay '+fmt(q.loan):''}</button><button class="alt" onclick="closeModal()">Thôi</button></div></div></div>`)}
function confirmBuy(){if(!BP)return;const o={ltvPct:BP.ltv,termYears:BP.term,pkgId:BP.pkg},id=BP.id;BP=null;$('modal','');E.buy(G,id,o);draw()}
/* ---------- trả bớt nợ ---------- */
function askPrepay(uid){const u=E.unit(G,uid);if(!u||!u.loan)return;const bal=u.loan.bal,pct=E.penaltyPct(G,u),z=E.zone(G,u.zone);
 const b=(amt,label,cls)=>{const q=E.prepayQuote(G,uid,amt);return `<button class="${cls||'alt'}" data-amt="${Math.round(q.amount)}" ${q.ok?'':'disabled'} onclick="doPrepay(${uid},${amt})">${label}<small>cần ${fmt(q.total)} tiền mặt${q.penalty?` (gồm phạt ${fmt(q.penalty)})`:''}</small></button>`};
 $('modal',`<div class="modal" id="prep"><div class="card"><h3>💸 Trả bớt nợ</h3><p>${esc(z.name)}: dư nợ ${fmt(bal)}, đang góp ~${mTxt(E.quarterPreview(G,u).total/3)}/tháng. Phạt trả trước hạn ${pr(pct)} (năm vay thứ ${Math.floor(u.loan.m/12)+1}). Trả bớt thì tiền góp hằng tháng giảm.</p>
 <div class="acts col">${[200,500,1000].filter(x=>x<bal-0.5).map(x=>b(x,'Trả '+fmt(x))).join('')}${b(bal,'Tất toán '+fmt(bal),'')}<button class="ghost" onclick="closeModal()">Thôi</button></div></div></div>`)}
function doPrepay(uid,amt){$('modal','');E.prepay(G,uid,amt);draw()}
function act(k,id){if(k==='buy')E.buy(G,id);if(k==='sell')E.sell(G,id);if(k==='rent')E.rent(G,id);draw()}
function choose(i){E.choose(G,i);draw()}
function next(){sel=null;BP=null;$('sheet','');showQuarter(E.endQuarter(G))}
/* dòng tách lời/lỗ quý (engine tính sẵn trong r.breakdown, các phần đã làm tròn cộng lại đúng bằng số lớn), vd "−785 = giá −123 · lãi −242 · phát mãi −372 · phạt −48" */
const bn=n=>(n>0?'+':n<0?'\u2212':'')+Math.abs(n).toLocaleString('vi-VN');
function bdHTML(b){if(!b||!b.show)return '';const ps=b.parts;
 return `<div class="bd" id="pnlbd" data-total="${b.total}" data-parts="${esc(ps.map(x=>x.key+':'+x.rounded).join(','))}"><span>${bn(b.total)} =</span> ${ps.map((x,i)=>`<span>${x.label} ${bn(x.rounded)}${i<ps.length-1?' ·':''}</span>`).join(' ')}</div>`}
function showQuarter(r){const p=Math.round(r.pnl),zn=id=>esc(short(E.zone(G,id)));
 const pnl=`<div class="pnl" id="pnl"><small>Quý này bạn ${p>0?'lời':p<0?'lỗ':'hòa vốn'}</small><div class="big ${p>=0?'up':'down'}">${sgn(r.pnl)}</div>${r.quiet?'':bdHTML(r.breakdown)}<small class="sub">Tài sản ròng: ${fmt(r.worth-r.pnl)} → ${fmt(r.worth)} (gồm giá nhà, tiền thuê, lãi vay, lãi tiền gửi; tiền trả gốc không tính là lỗ)</small></div>`;
 const rentRow=(r.rent?`<div class="row"><span>Tiền thuê nhận</span><span class="up">+${fmt(r.rent)}</span></div>`:'')+
  (Math.round(r.depositInterest||0)>0?`<div class="row" id="deprow" data-v="${Math.round(r.depositInterest)}"><span>Lãi tiền gửi</span><span class="up">+${fmt(r.depositInterest)}</span></div>`:''); // lãi tiết kiệm trên tiền mặt, ngay trên dòng trả góp
 const pay=r.pay.total>0?`<div class="row" id="payrow" data-total="${Math.round(r.pay.total)}" data-p="${Math.round(r.pay.p)}" data-i="${Math.round(r.pay.i)}"><span>Trả góp ngân hàng</span><span class="down r">−${fmt(r.pay.total)}<br><small>gốc ${fmt(r.pay.p)}, lãi ${fmt(r.pay.i)}</small></span></div>`:'';
 const debt=E.debt(G),notes=r.promoEnds.map(x=>`<p class="note2 promo-end">⏰ <b>Hết ưu đãi:</b> lãi căn ${zn(x.zone)} tăng từ ${pr(x.from)} lên ${pr(x.to)}/năm từ quý sau.</p>`)
  .concat(r.baseEvent||(debt>0&&Math.abs(r.baseTo-r.baseFrom)>=0.1)?[`<p class="note2 base">🏦 Lãi cơ sở ngân hàng: ${pr(r.baseFrom)} → ${pr(r.baseTo)}/năm${r.baseEvent?' (theo tin quý này)':''}${debt>0?', áp dụng cho khoản vay đã hết ưu đãi từ quý sau':''}.</p>`]:[])
  .concat(r.fireSales.map(x=>`<p class="note2 firesale">🚨 <b>Không đủ tiền trả góp</b>, ngân hàng phát mãi căn ${zn(x.zone)}: bán ${fmt(x.price)} (thấp hơn thị trường ${G.M.fireSaleDiscountPct}%), trừ phí, trả nợ ${fmt(x.debt)}${x.penalty?` và phạt trả trước ${fmt(x.penalty)}`:''}, bạn còn nhận ${fmt(x.net)}.</p>`))
  .concat(G.cash<0?[`<p class="note2 firesale">⚠️ Tiền mặt đang âm ${fmt(-G.cash)}: bán các căn còn lại cũng không đủ trả nợ ngân hàng. Hãy bán bớt hoặc cho thuê để bù.</p>`]:[])
  .concat(r.ltvCap?[`<p class="note2 base">🏦 Ngân hàng hạ tỷ lệ cho vay tối đa còn ${r.ltvCap.pct}% giá căn cho khoản vay mới, trong ${r.ltvCap.until-r.round} quý tới.</p>`]:[]).join('');
 const btn=`<button id="qnext" style="margin-top:10px;width:100%" onclick="${G.done?'end()':'draw()'}">${G.done?'Xem kết quả':r.quiet?'Tiếp ▶':'Sang quý '+G.round+' ▶'}</button>`;
 $('bar','');
 if(r.quiet){$('modal',`<div class="modal"><div class="card compact" id="qpop">${pnl}<p class="one">${r.truth?'✅':'❌'} ${esc(r.ev.text)} <small>(tin ${r.truth?'thật':'giả'})</small></p><p class="zl" id="qzl">${G.zones.map((z,i)=>`<span class="${chc(z.last)}">${esc(short(z))} ${flat(z.last)?'đứng giá':sp(z.last)}${i<G.zones.length-1?' ·':''}</span>`).join(' ')}</p>${rentRow}${pay}${notes}${btn}</div></div>`);return}
 $('modal',`<div class="modal"><div class="card" id="qpop">${pnl}
 <h3>${r.truth?'✅ Tin là THẬT':'❌ Tin là GIẢ'}</h3><p style="opacity:.85">${r.ev.text}<br><small>Nguồn: ${r.ev.source||''}</small></p>
 ${G.zones.map(z=>`<div class="row"><span>${z.name}</span><span class="${chc(z.last)}">${pc(z.last)}</span></div>`).join('')}
 ${rentRow}${pay}${notes}${btn}</div></div>`)}
const sp=n=>(n>=0?'+':'\u2212')+Math.abs(n).toFixed(1).replace('.',',')+'%';
/* so với gửi tiết kiệm: tiền mặt trong game cũng hưởng lãi này (engine v3.5) nên so sánh công bằng */
function vsSave(ann){const d=(D.rules||{}).deposit12mPctYear;if(d==null)return null;const x=Math.round((ann-d)*10)/10,v=Math.abs(x).toFixed(1).replace('.',',');
 return {txt:x>0?`Hơn gửi tiết kiệm ${pr(d)}/năm: +${v} điểm`:x<0?`Kém gửi tiết kiệm ${pr(d)}/năm: \u2212${v} điểm`:`Ngang gửi tiết kiệm ${pr(d)}/năm`,up:x>=0}}
function end(){sel=null;BP=null;$('sheet','');$('modal','');$('bar','');if(!G._fin){G._fin=1;track('finish',{q:G.totalQ})}const R=E.result(G),t=R.title,pct=R.profitPct,ann=R.annualPct;
 const best=parseFloat(localStorage.bdsBestAnn||'-1e9');if(ann>best)localStorage.bdsBestAnn=ann.toFixed(1);
 const c=D.cta||{};
 $('app',`<canvas id="cv" width="1080" height="1080" style="width:100%;border-radius:14px;margin-top:8px"></canvas>
 ${(l=>`<div class="card lesson" id="lesson" data-key="${l.key}"><i>💡</i><span>${esc(l.text)}</span></div>`)(E.lesson(G))}
 <div class="card"><div class="row"><span>Tài sản ròng cuối ván</span><b>${fmt(R.worth)}</b></div><div class="row"><span>Số giao dịch</span><b>${R.trades}</b></div><div class="row"><span>Tiền thuê đã nhận</span><b>${fmt(G.stats.rent)}</b></div>${(D.rules||{}).deposit12mPctYear!=null?`<div class="row"><span>Lãi tiền gửi đã nhận</span><b id="rdep">${fmt(R.depositInterest)}</b></div>`:''}
 <div class="row"><span>Lãi ngân hàng đã trả</span><b id="rint">${fmt(R.interestPaid)}</b></div>${R.penalties>0?`<div class="row"><span>Phạt trả nợ trước hạn</span><b>${fmt(R.penalties)}</b></div>`:''}
 <div class="row"><span>Dư nợ còn lại</span><b id="rdebt">${fmt(R.debt)}</b></div>${R.fireSales?`<div class="row"><span>Căn bị ngân hàng phát mãi</span><b class="down">${R.fireSales}</b></div>`:''}
 <div class="row"><span>Đoán đúng hướng tin</span><b>${Math.round(R.rumorCallPct)}%</b></div></div>
 <a id="zalo" href="${c.zaloUrl||'#'}" target="_blank" rel="noopener" onclick="track('zalo')"><button style="width:100%;font-size:1.15em;padding:14px">${c.label||'Nhắn Zalo tư vấn'}</button></a>
 <div style="text-align:center;margin-top:6px"><button class="ghost" onclick="share()">Chia sẻ</button><button class="ghost" onclick="saveImg()">Tải ảnh</button>${c.formUrl?`<a href="${c.formUrl}" target="_blank" rel="noopener"><button class="ghost">Để lại thông tin</button></a>`:''}<button class="ghost" id="replay" onclick="track('replay');start()">Chơi lại</button></div>
 <p class="warn">${D.disclaimer||''}</p>`);drawCard(t,pct,ann);window._res={t,pct,ann}}
function drawCard(t,pct,ann){const c=document.getElementById('cv'),x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,1080,1080);g.addColorStop(0,'#0f2e2a');g.addColorStop(1,'#2c6b62');x.fillStyle=g;x.fillRect(0,0,1080,1080);
 x.fillStyle='#e7b84b';x.fillRect(80,80,920,8);x.textAlign='center';x.fillStyle='#f3f7f5';
 x.font='600 44px system-ui';x.fillText('NHÀ ĐẦU TƯ TÍ HON',540,200);x.font='36px system-ui';x.fillText(G.p.name,540,260);
 x.fillStyle='#e7b84b';x.font='bold 84px system-ui';wrap(x,t.name,540,440,900,96);
 x.fillStyle='#f3f7f5';x.font='40px system-ui';wrap(x,t.desc,540,620,880,52);
 x.font='bold 120px system-ui';x.fillStyle=pct>=0?'#8fe3a1':'#ff9b8a';x.fillText(sp(pct),540,840);
 x.fillStyle='#f3f7f5';x.font='38px system-ui';x.fillText(`sau ${G.totalQ} quý · ≈ ${sp(ann)}/năm`,540,900);
 const vs=vsSave(ann);if(vs){x.font='600 34px system-ui';x.fillStyle=vs.up?'#8fe3a1':'#ffb4a6';x.fillText(vs.txt,540,952);x.fillStyle='#f3f7f5'}
 x.font='30px system-ui';x.fillText('Bạn là nhà đầu tư kiểu gì? Chơi thử ngay!',540,1005);x.font='22px system-ui';x.globalAlpha=.7;x.fillText('Game mô phỏng, giá và lãi suất không phải số thật',540,1045);x.globalAlpha=1}
function wrap(x,t,cx,y,w,lh){const ws=t.split(' ');let l='',ls=[];ws.forEach(v=>{const tt=l?l+' '+v:v;if(x.measureText(tt).width>w){ls.push(l);l=v}else l=tt});ls.push(l);ls.forEach((v,i)=>x.fillText(v,cx,y+i*lh))}
function saveImg(){const a=document.createElement('a');a.download='nha-dau-tu-ti-hon.png';a.href=document.getElementById('cv').toDataURL('image/png');a.click()}
async function share(){const {t,pct,ann}=window._res,txt=`Mình là "${t.name}" (${sp(pct)} sau ${G.totalQ} quý, ≈ ${sp(ann)}/năm${(v=>v?', '+v.txt.toLowerCase():'')(vsSave(ann))}) trong game Nhà Đầu Tư Tí Hon! Bạn là nhà đầu tư kiểu gì?`;
 try{const b=await new Promise(r=>document.getElementById('cv').toBlob(r));const f=new File([b],'ket-qua.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],text:txt+' '+location.href});
  if(navigator.share)return navigator.share({title:'Nhà Đầu Tư Tí Hon',text:txt,url:location.href})}catch(e){}
 navigator.clipboard.writeText(txt+' '+location.href);alert('Đã sao chép nội dung chia sẻ!')}
load().then(start);
</script></body></html>
