<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ván đầu tư — game mô phỏng bất động sản</title>
<link rel="icon" href="img/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f7f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ván đầu tư">
<meta property="og:title" content="Ván đầu tư — bạn là nhà đầu tư kiểu gì?">
<meta property="og:description" content="Game mô phỏng 3 phút: đọc tin, mua bán, vay, cho thuê và nhận danh hiệu.">
<style>
:root{--bg:#f4f7f4;--card:#ffffff;--card2:#ffffff;--gold:#e7b84b;--up:#1f7a45;--down:#c2412d;--tx:#142824;--soft:#e7f0ec;--line:#d5e2dc}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
.wrap{max-width:560px;margin:auto;padding:12px 12px 110px}
.card{background:var(--card);border-radius:14px;padding:12px;margin:8px 0;border:1px solid #e3ece7}
.top{display:flex;justify-content:space-between;gap:6px;font-size:.85em;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.top b{display:block;font-size:1.15em}
.news{background:#fff;border-left:4px solid var(--gold)}
.src{font-size:.8em;opacity:.8;margin-top:4px}
.zone{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.zone .nm{font-weight:600}.zone small{opacity:.75}
.price{text-align:right;font-weight:700}.up{color:var(--up)}.down{color:var(--down)}.flat{color:#5c726c}
.acts{grid-column:1/3;display:flex;gap:6px}.acts button{flex:1;padding:8px 4px;font-size:.8em}
button{font:inherit;background:var(--gold);color:#1b1b1b;border:0;border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer}
button.alt{background:var(--soft);color:var(--tx)}button.ghost{background:transparent;color:var(--tx);text-decoration:underline;padding:6px}
button:disabled{opacity:.35;cursor:not-allowed}
#lockbtns button.held:disabled{opacity:1;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:9}
.bar:empty{display:none}.bar .main{flex:1;max-width:260px;font-size:1.05em}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:480px;width:100%;background:var(--card2);max-height:92vh;overflow:auto}
.tag{display:inline-block;font-size:.72em;background:var(--soft);border-radius:6px;padding:2px 6px;margin-left:4px}
.hero{display:block;width:100%;height:auto;aspect-ratio:1200/460;object-fit:cover;border-radius:10px;margin-bottom:8px;background:#c5d6ce}
.warn{font-size:.75em;opacity:.65;text-align:center;margin:12px 0}
.row{display:flex;justify-content:space-between;padding:3px 0}
h1,h2,h3{margin:.3em 0}
/* bản đồ phân khu */
.map{position:relative;width:100%;aspect-ratio:366/430;border-radius:16px;overflow:hidden;background:#d7ead9;margin:8px 0 4px;user-select:none;-webkit-user-select:none}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile{position:absolute;background:#fff;color:var(--tx);border-radius:10px;padding:3px 8px;box-shadow:0 1px 3px #1428241a;border:1.5px solid var(--line);display:flex;flex-direction:column;justify-content:center;cursor:pointer;line-height:1.25;-webkit-tap-highlight-color:transparent}
.tile b{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .pr{font-size:12px;font-weight:600;white-space:nowrap}
.tile .pr i{font-style:normal;margin-left:3px}.tile .pr i.fl{font-size:10.5px;font-weight:500}
.tile:active{transform:scale(.97)}
.tile.sel,.tile.hot{border:2px solid var(--gold)}
.tile.flash{animation:pxflash 200ms ease-out 1}
@keyframes pxflash{from{background:#e7b84b}to{background:#fff}}
.own{position:absolute;top:-9px;right:-8px;background:var(--gold);color:#1b1b1b;border-radius:10px;font-weight:700;font-size:10.5px;padding:1px 6px;font-style:normal;box-shadow:0 1px 3px #0006}
.lock{position:absolute;top:-10px;left:-9px;font-size:11px;font-style:normal;background:#fff;border:1px solid var(--gold);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.hint{font-size:.75em;opacity:.8;text-align:center;margin:4px 0 8px}
.hint .g{color:var(--gold);font-weight:700}
/* bottom sheet */
.dim{position:fixed;inset:0;background:#0008;z-index:8}
.sheet{position:fixed;left:0;right:0;margin:0 auto;max-width:560px;bottom:var(--barh,64px);background:var(--card2);border-radius:18px 18px 0 0;padding:8px 14px 14px;box-shadow:0 -6px 20px #0008;z-index:10;max-height:calc(100vh - var(--barh,64px) - 40px);overflow:auto}
.dim.anim{animation:fade 180ms ease-out}.sheet.anim,.lgb.rise,.modal.rise .card{animation:rise 180ms ease-out}
@keyframes rise{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.grab{width:40px;height:4px;border-radius:2px;background:#c5d6ce;margin:0 auto 8px}
.sheet .x{position:absolute;right:8px;top:6px;background:transparent;color:var(--tx);font-size:18px;padding:4px 8px;opacity:.7}
.sheet .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-right:26px}
.sheet .hd b{font-size:17px}.sheet .hd small{font-size:12px;opacity:.8}
.spark{display:block;width:100%;height:auto;margin:8px 0 4px}
.chip{display:inline-block;font-size:11.5px;background:var(--soft);border-radius:6px;padding:3px 7px;margin:2px 4px 2px 0}
.chip.hotc{border:1px solid var(--gold)}
.sheet .acts{display:flex;gap:8px;margin-top:10px}.sheet .acts button{flex:1;font-size:13px;line-height:1.35;padding:9px 3px}.acts button small{display:block;font-size:12px;white-space:nowrap}.acts button small.why{white-space:normal;font-size:10.5px;font-weight:500;opacity:.9;margin-top:2px}.sheet .acts button.loanbuy{flex:1.45}.loanbuy small.why{margin:0 0 1px}
/* popup cuối quý */
.pnl{text-align:center;padding:4px 0 10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.pnl small{display:block;font-size:.9em;opacity:.85}
.pnl .big{font-size:46px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.pnl .sub{font-size:.75em;opacity:.7;margin-top:2px}
.pnl .bd{font-size:.78em;opacity:.8;margin:3px 6px 0;line-height:1.45}.pnl .bd span{white-space:nowrap}
.zl{font-size:.8em;margin:-2px 0 6px;line-height:1.45}.zl span{white-space:nowrap}
.dnote{display:block;font-size:.78em;opacity:.8;margin:0 4px 6px}
/* v3: độ dài ván, vay ngân hàng */
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.chips.col{flex-direction:column}
.chipb{flex:1;min-width:56px;background:var(--soft);color:var(--tx);border:1.5px solid #c5d6ce;padding:8px 4px;line-height:1.25;font-size:.9em}
.chipb small{display:block;font-size:11px;opacity:.75;font-weight:500}.chipb.on{background:var(--gold);color:#1b1b1b;border-color:var(--gold)}.chipb.on small{opacity:.85}
.chipb.pk{text-align:left;padding:8px 10px}.chipb.inc{display:flex;align-items:baseline;gap:10px;padding:7px 10px}.chipb.inc b{min-width:52px;white-space:nowrap}.chipb.inc small{display:inline;font-size:11.5px}
.note{display:block;opacity:.78;font-size:.78em;margin-top:6px;line-height:1.35}
.lab{font-size:.8em;opacity:.8;margin-top:10px}
.sum{background:var(--soft);border-radius:10px;padding:8px 10px;margin:10px 0 6px}.sum .row{align-items:baseline;gap:8px}.r{text-align:right}
.binfo{font-size:.78em;line-height:1.2;display:flex;flex-direction:column;justify-content:center;padding:0 6px;min-width:112px;opacity:.95}.binfo b{font-size:1.2em;color:var(--tx)}
.pf .pfh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.pf .pfh small{opacity:.75;font-size:.75em}
.pfrow,.urow{background:var(--soft);border-radius:10px;padding:7px 9px;margin-top:6px;font-size:.85em;line-height:1.35}.pfrow{cursor:pointer}
.pfrow .l1,.urow .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.pfrow .l1 small,.urow .l1 small{opacity:.8;font-size:.85em;text-align:right}
.l2{font-weight:600}.l3{font-size:.85em;opacity:.85;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 6px}.l3 b{color:var(--gold);font-weight:600}
.urow{font-size:.82em}.units{margin-top:4px}
button.mini{background:var(--soft);color:var(--tx);}font-size:11.5px;padding:5px 8px;border-radius:8px;flex:none}
.acts.col{flex-direction:column;gap:2px}.sheet .acts button.buyb{flex:none;width:100%;font-size:14px;padding:10px 8px}.sheet .acts button.buyb small{white-space:normal}.acts button small.det{white-space:normal;font-size:10.5px;font-weight:500;opacity:.9}
button.ghost.cfg{font-size:12.5px;padding:4px;opacity:.9}
.note2{font-size:.85em;background:var(--soft);border-radius:8px;padding:6px 8px;margin:6px 0}.promo-end{border-left:3px solid var(--gold)}.firesale{border-left:3px solid var(--down)}
.res .vs{margin-top:4px;font-weight:600}.compact .one{margin:6px 0;font-size:.95em}
.res{text-align:center}.res .big{font-size:40px;font-weight:800}
.lesson{display:flex;gap:8px;align-items:flex-start;font-size:.95em;line-height:1.4;border-left:4px solid var(--gold)}.lesson i{font-style:normal}
.mw{display:inline-block;margin-top:6px;font-size:.78em;font-weight:600;background:var(--soft);border:1px solid #ffffff33;border-radius:6px;padding:2px 7px}
.tips{display:flex;flex-direction:column;gap:4px;margin:2px 0 8px}.tips span{font-size:.8em;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.3}
.rulesb{display:block;margin:0 auto 8px;font-size:.8em;padding:5px 12px;background:var(--soft);color:var(--tx)}
#rules ul{padding-left:18px;margin:6px 0;font-size:.9em;line-height:1.45}#rules li{margin:3px 0}#rules .warn{text-align:left;margin:8px 0}
#buyp .acts,#prep .acts{display:flex;gap:8px;margin-top:8px}#buyp .acts button{flex:1}#prep .acts.col button{width:100%;margin:3px 0}
#buyp .card{padding:14px}#buyp h3{margin:0 0 2px;font-size:19px}.bpsub{font-size:12.5px;opacity:.8;margin-bottom:10px}
.bphero{background:var(--soft);border-radius:12px;padding:10px 12px;border:1.5px solid var(--gold)}.bpbig{display:flex;gap:8px}.bpbig>div{flex:1}.bpbig small{display:block;font-size:11.5px;opacity:.75}.bpbig b{font-size:21px}
.bpok{margin-top:6px;font-size:12.5px;line-height:1.4}.bpwarn{margin-top:6px;font-size:12.5px;color:var(--down);line-height:1.4}.bpinfo{margin-top:6px;font-size:12.5px;opacity:.85;line-height:1.4}
#buyp .lab{font-size:12.5px;margin:10px 0 0}#buyp .chips{margin-top:5px;flex-wrap:nowrap}#buyp .chipb{min-width:0;padding:7px 2px;font-size:14px;line-height:1.2}#buyp .chipb small{font-size:10.5px}
.bplink{background:none;color:var(--gold);padding:0;font-weight:600;font-size:13px;white-space:nowrap}.bplab{display:flex;justify-content:space-between;align-items:center}
.bppk{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border:1.5px solid var(--gold);border-radius:10px;padding:7px 10px;font-size:13.5px;margin-top:5px}.bppk small{display:block;font-size:11.5px;opacity:.75;font-weight:400}
.bpdet{display:block;margin-top:8px;font-size:12.5px;font-weight:500;text-decoration:underline;white-space:normal;text-align:left}.bpdetail{margin:5px 0 0;padding:6px 10px;font-size:13px}.bpdetail .row{padding:1px 0}.bpdetail .note{margin-top:3px;line-height:1.3}
.bppl{background:var(--soft);border-radius:10px;overflow:hidden;margin-top:5px}.bppr{display:grid;grid-template-columns:1fr auto auto;gap:8px;width:100%;padding:7px 10px;font-size:13px;border-top:1px solid var(--line);border-radius:0;align-items:center;text-align:left;background:none;color:var(--tx);font-weight:400}
.bppr:first-child{border-top:0}.bppr.on{background:#e7b84b22;box-shadow:inset 3px 0 0 var(--gold)}.bppr small{display:block;font-size:11px;opacity:.7;font-weight:400}.bppr .r{font-weight:700;text-align:right;white-space:nowrap}.bppr .r small{font-weight:400}.bppr .m{font-size:12px;text-align:right;opacity:.9;min-width:44px}.bppr.hd{font-size:11px;opacity:.65;padding:5px 10px}
.bpfix{font-size:12.5px;text-decoration:underline;white-space:normal;text-align:left}.bpfoot{font-size:11.5px;opacity:.75;margin-top:6px}#buyp .acts{margin-top:9px}#buyp .acts button.bpgo{flex:2.2;line-height:1.25;font-size:14px;font-weight:700}#buyp .acts button.bpgo small{display:block;font-size:11.5px;font-weight:500}#buyp #bpshort{font-size:12.5px;margin:8px 0 0}
/* v3.7 sổ tài chính */
.tnw{cursor:pointer}.top b.tap{display:table;border-bottom:1.5px dashed var(--gold);padding-bottom:1px}
.lg{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:30}
.lgb{background:var(--card2);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:10px 14px 18px;box-shadow:0 -6px 20px #0008}
.lghandle{width:42px;height:4px;background:#c5d6ce;border-radius:4px;margin:2px auto 8px}.lghrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.lghrow h3{margin:0;font-size:17px}
.lgx{background:transparent;color:var(--tx);font-size:20px;opacity:.7;padding:4px 6px;font-weight:400}
.lgtabs{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:3px;margin:6px 0 10px}.lgtab{flex:1;background:none;color:var(--tx);padding:7px 4px;font-size:12.5px;font-weight:600;border-radius:8px;opacity:.7}.lgtab.on{background:var(--gold);color:#1b1b1b;opacity:1}
.lgeq{background:var(--soft);border:1.5px solid var(--gold);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.lgeq small{display:block;font-size:11.5px;opacity:.75}.lgeq b{font-size:20px}.lgeq .r{text-align:right}.lgeq .r b{font-size:16px}
.lgsec{font-size:12px;opacity:.75;margin:10px 0 4px;font-weight:600;letter-spacing:.02em}.lgchip{display:inline-block;background:var(--soft);border:1px solid #c5d6ce;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:4px}
.lgrow.deplock{cursor:pointer}.lgbox{background:var(--soft);border-radius:12px;overflow:hidden}.lgrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 10px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.35}
.lgrow:first-child{border-top:0}.lgrow small{display:block;font-size:11.5px;opacity:.7;font-weight:400}.lgrow .amt{font-weight:700;white-space:nowrap}.lgrow.tot{background:#e7b84b18;font-weight:700}.lgrow.tot .amt:not(.up):not(.down){color:var(--gold)}.lgz{opacity:.5}.lgrow.sub{background:none;font-weight:600;font-size:12.5px;padding:5px 10px}.lgrow.sub .amt:not(.up):not(.down){color:inherit}
.lgbal{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:12.5px;margin:8px 2px 0;opacity:.9}.lgrecon{font-size:12px;line-height:1.45;margin:8px 2px 0;padding:8px 10px;background:var(--soft);border-radius:10px;border-left:3px solid var(--gold)}.lgrecon small{opacity:.7}.lgrecon b{font-weight:700}.lgnote{font-size:11.5px;opacity:.7;margin-top:8px;line-height:1.4}
.lgkpi{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.lgkpi .c{background:var(--soft);border-radius:10px;padding:9px 10px}.lgkpi small{display:block;font-size:11px;opacity:.7}.lgkpi b{font-size:16px}.lgkpi .ok{color:var(--up)}.lgkpi .c.wide{grid-column:1/-1}.lgkpi .warn{color:var(--down)}
/* hồ sơ khoản vay */
.lfh{display:flex;align-items:center;gap:8px}.lfh h3{margin:0;font-size:17px;flex:1}.lfback{background:transparent;border:0;color:var(--gold);font-size:22px;padding:0 2px;line-height:1}
.lfsub{font-size:12.5px;opacity:.8;margin:2px 0 10px 26px}
.lfnums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.lfnums div{background:var(--soft);border-radius:10px;padding:8px 6px}.lfnums small{display:block;font-size:11px;opacity:.7}.lfnums b{font-size:15px}
.lfst{margin:8px 2px 0;font-size:12.5px;line-height:1.4}.lfst b{color:var(--gold)}
.lfchart{background:var(--soft);border-radius:12px;padding:8px 8px 4px}.lfcap{display:flex;justify-content:space-between;font-size:11px;opacity:.75;margin-bottom:2px}
.lftbl{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--soft);border-radius:12px;overflow:hidden}
.lftbl th{font-size:11px;font-weight:600;opacity:.65;text-align:right;padding:6px 5px}.lftbl th:first-child,.lftbl td:first-child{text-align:left}
.lftbl td{padding:7px 5px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.lftbl tr.now{background:#e7b84b22;box-shadow:inset 3px 0 0 var(--gold)}.lftbl tr.flip td{border-top:1px dashed #e7b84b88}
.lftag{color:var(--gold);font-size:10.5px;display:block;font-weight:600}
.lfbtn{margin-top:12px;width:100%;border:1.5px solid var(--line);background:var(--soft);color:#5c726c;border-radius:10px;padding:10px;font-weight:700;font-size:14px;text-align:left}
.lfbtn:disabled{opacity:1;cursor:not-allowed}.lfbtn small{display:block;font-weight:500;font-size:12px;opacity:.9;margin-top:2px}
.lgloan{cursor:pointer}

/* đấu 2 người, máy này. Solo không bật ROOM. */
.rclock{margin:0 0 8px;background:var(--soft);border-radius:10px;padding:8px 10px}
.rclock .track{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:6px}
.rclock .track i{display:block;height:100%;background:var(--gold);width:0}
.rclock .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:8px}
.rclock b{font-size:16px;color:var(--gold)}
.rclock small{opacity:.75}
.rwait{margin:0 0 8px;background:var(--soft);border:1.5px solid var(--up);border-radius:10px;padding:10px}
.rwait b{display:block;color:var(--up);font-size:16px}
.rwait small{display:block;margin-top:3px;font-size:12.5px;opacity:.85;line-height:1.4}
.map.locked{opacity:.4;pointer-events:none}
.bar.room{z-index:26}
#roomfloat{position:fixed;top:8px;left:0;right:0;z-index:25;display:flex;justify-content:center;pointer-events:none}
#roomfloat:empty{display:none}
#roomfloat .rf{width:min(536px,calc(100% - 24px))}
.rfnote{margin:4px 0 0;text-align:center;background:#ffffff;border-radius:8px;padding:4px 8px}
.rcode{font-size:28px;letter-spacing:4px;font-weight:800;color:var(--gold);margin:4px 0}
.rlink{font-size:14px;word-break:break-all;line-height:1.4;margin:2px 0 0;color:var(--gold)}
.rlock{font-weight:700;font-size:16px;line-height:1.35;margin-top:2px}
button.rcopy{width:100%;margin-top:8px}
button.rstart{width:100%;margin-top:10px;background:var(--soft);color:var(--tx)}
button.rstart:not(:disabled){background:var(--gold);color:#1b1b1b}
button.chipb.lock{position:static;top:auto;left:auto;width:auto;height:auto;min-width:56px;border-radius:0;display:inline-block;flex:1;font-size:.9em;align-items:stretch;justify-content:flex-start;opacity:.85;cursor:default;pointer-events:none}button.chipb.lock.on{background:var(--gold);color:#1b1b1b;opacity:1}
.rdil{border-left:4px solid var(--gold)}
.rdil #rskip{text-align:left;margin:8px 0 0}
.rdil .dilacts{display:flex;flex-direction:column;gap:6px}
.rdil .dilacts button{width:100%;margin:0;text-align:left}
.rdil .dilacts button small{display:block;font-size:12px;font-weight:500;line-height:1.35;margin-top:4px;white-space:normal}
.rjoin{display:flex;gap:6px;margin-top:8px}.rjoin input{flex:1;min-width:0;border-radius:10px;border:1.5px solid #c5d6ce;background:var(--soft);color:inherit;padding:8px 10px;font:inherit}
#depcard input,#breakcard input{width:100%;box-sizing:border-box;border-radius:10px;border:1.5px solid #c5d6ce;background:var(--soft);color:inherit;padding:8px 10px;font:inherit;margin:4px 0 8px}#depcard .acts,#breakcard .acts{margin-top:4px}
</style></head><body><div class="wrap" id="app"></div><div id="bar" class="bar"></div><div id="sheet"></div><div id="modal"></div><div id="ledger"></div><div id="loanfile"></div><div id="roomfloat"></div>
<script src="engine.js"></script>
<script>
let D,G,sel=null,sheetAnim=false,priceFlash=false,ledgerAnim=false,popAnim=false,selQ=null,selInc=null,BP=null,ROOM=null,ROOM_T=null;const E=Engine;
const $=(id,h)=>{document.getElementById(id).innerHTML=h;if(id==='modal'||id==='loanfile')syncFloat()};
const fmt=n=>(n<0?'-':'')+Math.round(Math.abs(n)).toLocaleString('vi-VN')+' tr';
const sgn=n=>{const v=Math.round(n);return (v>0?'+':v<0?'\u2212':'')+Math.abs(v).toLocaleString('vi-VN')+' tr'};
const flat=n=>Math.abs(+n.toFixed(1))===0; // làm tròn ra 0,0% => đứng giá
const pc=n=>flat(n)?'đứng giá':(n>=0?'▲ +':'▼ \u2212')+Math.abs(n).toFixed(1).replace('.',',')+'%'; // vd ▲ +2,9% / ▼ −0,5%
const chc=n=>flat(n)?'flat':n>=0?'up':'down';
const pr=n=>(Math.round(n*100)/100).toLocaleString('vi-VN')+'%'; // lãi suất, vd 9,5%
const mTxt=n=>{const v=Math.abs(n);return (v>0&&v<10?(Math.round(v*10)/10):Math.round(v)).toLocaleString('vi-VN')+' tr'}; // số tiền hằng tháng
const vol=r=>r<0.3?'Biến động thấp':r<0.5?'Biến động vừa':'Biến động cao';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){for(const f of['data/game-data.json','data/sample-data.json']){try{const r=await fetch(f,{cache:'no-cache'});if(r.ok){D=await r.json();return}}catch(e){}}}
function lenOpts(){return E.quarterOptions(D)}
function getLen(){const o=lenOpts(),s=+localStorage.bdsLen,d=(D.rules||{}).quarters;return o.includes(s)?s:o.includes(d)?d:o[0]}
function setLen(q){selQ=q;try{localStorage.bdsLen=q}catch(e){}document.querySelectorAll('#lenChips button').forEach(b=>b.classList.toggle('on',+b.dataset.q===q));const t=document.getElementById('introQ');if(t)t.textContent=q+' quý ('+q/4+' năm)'}
// v3.8 thu nhập kê khai (rules.income): chỉ để ngân hàng xét hạn mức vay, không cộng vào tiền mặt. Mặc định defaultId mỗi lần mở trang; chơi lại giữ lựa chọn.
const incR=()=>(D.rules||{}).income||{},incOpts=()=>E.incomeOptions(D);
function getInc(){const o=incOpts();return o.some(x=>x.id===selInc)?selInc:((o.find(x=>x.id===incR().defaultId)||o[o.length-1]||{}).id||null)}
function setInc(id){selInc=id;document.querySelectorAll('#incChips button').forEach(b=>b.classList.toggle('on',b.dataset.inc===id))}
const dtiMsg=()=>(incR().dtiBlockedMsg||'Vượt hạn mức nợ trên thu nhập').replace(/\.\s*$/,'');
function start(){ROOM=null;if(ROOM_T){clearInterval(ROOM_T);ROOM_T=null}const rf=document.getElementById('roomfloat');if(rf)rf.innerHTML='';const bar0=document.getElementById('bar');if(bar0)bar0.classList.remove('room');sel=null;BP=null;LG=null;$('ledger','');$('loanfile','');selQ=getLen();selInc=getInc();$('bar','');$('modal','');$('sheet','');
 const best=localStorage.bdsBestAnn;
 $('app',`<h1>Ván đầu tư</h1><div class="card">Bạn có <b id="introQ">${selQ} quý (${selQ/4} năm)</b> để làm giàu. Mỗi quý có một tin tức, nhưng <b>tin chưa chắc đã đúng</b>: hãy xem nguồn tin rồi quyết định mua (có thể vay ngân hàng), bán hay cho thuê. Chốt quý xong mới biết tin thật hay giả.</div>
 <div class="card"><b>Độ dài ván</b><div class="chips" id="lenChips">${lenOpts().map(q=>`<button class="chipb${q===selQ?' on':''}" data-q="${q}" onclick="setLen(${q})">${q} quý<small>${q/4} năm</small></button>`).join('')}</div><small class="note">Ván dài có thêm tin tức, tình huống, và đủ thời gian để khoản vay hết ưu đãi rồi thả nổi lãi.</small></div>`+
 (incOpts().length?`<div class="card" id="incCard"><b>Thu nhập mỗi tháng</b> <small>(kê khai khi vay)</small><div class="chips col" id="incChips">${incOpts().map(o=>`<button class="chipb pk inc${o.id===selInc?' on':''}" data-inc="${o.id}" onclick="setInc('${o.id}')"><b>${esc(o.label)}</b><small>${esc(o.hint||'')}</small></button>`).join('')}</div>${incR().pickerNote?`<small class="note" id="incNote">${esc(incR().pickerNote)}</small>`:''}</div>`:'')+
 D.projects.map(p=>`<div class="card">${p.image?`<img class="hero" src="${p.image}" alt="${esc(p.name)}">`:''}<b>${p.name}</b><br><small>${p.tagline||''} · Vốn ${fmt(p.startCapital)}</small><br><button style="margin-top:8px" data-pick="${p.id}" onclick="pick('${p.id}')">Chơi dự án này</button></div>`).join('')+
 (roomApi()?`<div class="card" id="duelcard"><b>Đấu 2 người</b><br><small>Cùng một tin, giá và lãi suất. Mỗi người một sổ. Gửi link phòng qua Zalo hoặc Facebook.</small><br><button style="margin-top:8px" id="duelopen" onclick="openDuel()">Mở phòng</button><div class="rjoin"><input id="rjoincode" inputmode="numeric" maxlength="4" placeholder="Mã 4 số" aria-label="Mã phòng"><button type="button" class="alt" id="dueljoin" onclick="joinDuel()">Vào phòng</button></div></div>`:'')+
 (best?`<p class="warn">Kỷ lục của bạn: ≈ ${String(best).replace('.',',')}%/năm</p>`:''))}
/* bộ đếm sự kiện ẩn danh (start/finish/zalo/replay): chỉ gửi từ vinhomes.space, không cookie/ID; lỗi thì bỏ qua.
   Tắt khi test: ?test=1 hoặc ?notrack (notrack được nhớ trên máy này; ?notrack=0 để bật lại). */
const TRACK=(()=>{try{const h=location.hostname,q=new URLSearchParams(location.search);
 if(q.has('notrack')){if(q.get('notrack')==='0')localStorage.removeItem('bdsNoTrack');else localStorage.bdsNoTrack='1'}
 return (h==='vinhomes.space'||h==='www.vinhomes.space')&&!q.has('test')&&!q.has('notrack')&&!localStorage.bdsNoTrack}catch(e){return false}})();
window._evLog=[];
function track(e,x){const p=G&&G.p?G.p.id:'';let s='e='+e+(p?'&p='+p:'');if(x)for(const k in x)s+='&'+k+'='+encodeURIComponent(x[k]);
 window._evLog.push(e+(p?':'+p:'')+(x&&x.q?':q'+x.q:''));if(!TRACK)return;
 try{const u='/api/ev?'+s;if(!(navigator.sendBeacon&&navigator.sendBeacon(u)))fetch(u,{method:'POST',keepalive:true}).catch(()=>{})}catch(err){}}
function pick(id){G=E.newGame(D,id,undefined,{quarters:selQ||getLen(),incomeId:selInc||getInc()});sel=null;BP=null;track('start',{q:G.totalQ});draw()}

function roomCfg(){return (D&&D.rules&&D.rules.room)||{}}
function roomNote(){return roomCfg().dilemmaTimeoutNote||'Hết giờ chưa chọn thì bỏ qua.'}
function roomMax(){const n=+roomCfg().clockSeconds;return n>0?n:60}
function roomApi(){try{const q=new URLSearchParams(location.search);if(q.get('roomApi'))return q.get('roomApi');const h=location.hostname;if(h==='vinhomes.space'||h==='www.vinhomes.space'||location.port==='8792')return location.origin+'/room-api';return 'http://127.0.0.1:8792/room-api'}catch(e){return null}}
function roomLink(code){const h=location.hostname;if(h==='vinhomes.space'||h==='www.vinhomes.space')return location.origin+'/game/?phong='+code;return 'https://vinhomes.space/game/?phong='+code}
async function copyRoomLink(){if(!ROOM||!ROOM.code)return;const link=roomLink(ROOM.code);const btn=document.getElementById('rcopy');try{await navigator.clipboard.writeText(link);if(btn)btn.textContent='Đã chép'}catch(e){const box=document.getElementById('rlinkbox');if(box)box.textContent=link}}
function projShort(p){return String(p.name||'').replace(/^Vinhomes\s+/,'')}
function roomLocked(){return !!(ROOM&&(ROOM.phase==='wait'||ROOM.youReady))}
function waitLine(){return 'Không sửa được nữa. đối thủ còn '+ROOM.secs+' giây, quý sẽ chuyển khi đối thủ chốt hoặc hết giờ.'}
function goldClock(){
 const max=ROOM.max||roomMax(),w=Math.max(0,Math.min(100,ROOM.secs/max*100));
 const opp=ROOM.oppReady?'đối thủ đã chốt':'đối thủ đang quyết';
 return `<div class="rclock" id="rclock"><div class="track"><i data-roomsecs data-roomkind="bar" style="width:${w}%"></i></div><div class="row"><b data-roomsecs data-roomkind="clock">Còn ${ROOM.secs} giây</b><small data-roomkind="opp">${opp}</small></div></div>`;
}
function roomBlock(){
 if(!ROOM||(ROOM.phase!=='play'&&ROOM.phase!=='wait'))return '';
 if(ROOM.phase==='wait')return `<div class="rwait" id="rwait"><b>Đã xong, đang chờ</b><small data-roomsecs data-roomkind="wait">${esc(waitLine())}</small></div>`;
 return goldClock();
}
function bookLine(b){
 if(!b||!Number.isFinite(+b.cash)||!Number.isFinite(+b.debt))return '';
 const no=Math.round(+b.debt)===0?'nợ 0':'nợ '+fmt(b.debt);
 const holds=Array.isArray(b.holds)?b.holds.filter(h=>h&&h.name&&Number.isFinite(+h.price)):[];
 const mid=holds.length?holds.map(h=>esc(String(h.name))+' '+fmt(h.price)).join(', '):'0 căn';
 const fee=Math.round(+b.fee)||0;
 return 'Tiền mặt '+fmt(b.cash)+' · '+mid+' · '+no+(fee?(' · phí bán ước tính '+fmt(fee)):'');
}
function duelDilemma(){
 if(!ROOM||ROOM.phase!=='play'||!G||!G.dilemma)return '';
 const d=G.dilemma;
 const btns=d.options.map((o,i)=>`<button ${i?'class="alt"':''} onclick="choose(${i})">${o.label}${dNote(o)}</button>`).join('');
 return `<div class="card rdil" id="dilemma"><h3>⚖️ Tình huống</h3><p>${d.text}</p><div class="dilacts">${btns}</div><p class="hint" id="rskip">${esc(roomNote())}</p></div>`;
}
function paintClock(){if(!ROOM)return;const n=ROOM.secs,max=ROOM.max||roomMax(),w=Math.max(0,Math.min(100,ROOM.secs/max*100));
 document.querySelectorAll('[data-roomkind="clock"]').forEach(e=>{e.textContent='Còn '+n+' giây'});
 document.querySelectorAll('[data-roomkind="bar"]').forEach(e=>{e.style.width=w+'%'});
 document.querySelectorAll('[data-roomkind="wait"]').forEach(e=>{e.textContent=waitLine()});
 document.querySelectorAll('[data-roomkind="opp"]').forEach(e=>{e.textContent=ROOM.oppReady?'đối thủ đã chốt':'đối thủ đang quyết'});
}
function syncFloat(){const el=document.getElementById('roomfloat');if(!el)return;
 const open=!!(document.getElementById('buyp')||document.getElementById('prep'));
 if(!ROOM||(ROOM.phase!=='play'&&ROOM.phase!=='wait')||!open){el.innerHTML='';return}
 const note=G&&G.dilemma&&ROOM.phase==='play'?`<p class="hint rfnote">${esc(roomNote())}</p>`:'';
 el.innerHTML='<div class="rf">'+roomBlock()+note+'</div>';
}
function roomFrom(st,tok){
 ROOM=ROOM||{};
 ROOM.server=true; ROOM.token=tok||ROOM.token; ROOM.code=st.code; ROOM.role=st.you==='p1'?'host':'join';
 ROOM.project=st.project; ROOM.quarters=st.quarters; ROOM.income=st.income; ROOM.seed=st.seed;
 ROOM.players=st.players; ROOM.max=st.max; ROOM.deadline=st.deadline||0; ROOM.oppReady=!!st.oppReady; ROOM.youReady=!!st.youReady;
 ROOM.you=st.you;
 if(ROOM.deadline)ROOM.secs=Math.max(0,Math.ceil((ROOM.deadline-Date.now())/1000)); else ROOM.secs=st.secs;
}
function roomSig(st){return [st.phase,st.project,st.quarters,st.income,st.players,st.code,st.you].join('|')}
async function roomFetch(path, body){
 const api=roomApi(); if(!api)throw new Error('no api');
 const r=await fetch(api+path,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
 const j=await r.json(); if(!r.ok&&j&&j.error)throw new Error(j.error); return j;
}
function roomArm(){if(ROOM_T)return; ROOM_T=setInterval(()=>{roomTick(); roomPoll().catch(()=>{})},250)}
function roomTick(){
 if(!ROOM||!ROOM.deadline||ROOM.phase==='lobby'||ROOM.phase==='done'||ROOM.phase==='finishing')return;
 if(document.getElementById('qnext'))return;
 const secs=Math.max(0,Math.ceil((ROOM.deadline-Date.now())/1000));
 if(secs!==ROOM.secs){ROOM.secs=secs; paintClock(); if(secs<=0)roomPoll().catch(()=>{})}
}
async function roomPoll(){if(!ROOM||!ROOM.token)return; const st=await roomFetch('/rooms/'+ROOM.code+'?token='+ROOM.token); roomApply(st)}
function roomApply(st){try{roomApplyBody(st)}catch(e){console.log("roomApply", e&&e.stack||e); window._roomErr=String(e&&e.stack||e)}}
function roomApplyBody(st){
 if(!ROOM)return;
 roomFrom(st);
 if(st.phase==='lobby'){
  ROOM.phase='lobby';
  const sig=roomSig(st);
  if(sig!==ROOM.sig||!document.getElementById('rlobby')){ROOM.sig=sig; drawLobby()}
  return;
 }
 if((st.phase==='play'||st.phase==='scoring'||st.phase==='done')&&!G){
  if(ROOM.booting)return;
  ROOM.booting=true;
  G=E.newGame(D,st.project,st.seed,{quarters:st.quarters,incomeId:st.income});
  E.duelBind(G);
  ROOM.phase=st.youReady?'wait':'play'; ROOM.booting=false; ROOM.sig='';
  draw();
 }
 if(G&&!G.done&&st.quarter>G.round&&!ROOM.syncing){
  ROOM.syncing=true; roomStep(); ROOM.syncing=false;
 }
 if(G&&G.done){roomSubmitWorth(); if(st.winner)showRoomResult(st); else if(ROOM.phase!=='finishing'){ROOM.phase='finishing'; showRoomWait(st)} return}
 if(ROOM.phase!=='between'&&G&&st.quarter===G.round&&!document.getElementById('qnext')){
  const want=st.youReady?'wait':'play';
  if(ROOM.phase!==want){ROOM.phase=want; draw()}
  else paintClock();
 }
}
function roomStep(){
 sel=null;BP=null;LG=null;$('ledger','');$('loanfile','');$('sheet','');$('modal','');
 const adv=E.duelAdvance(G);
 if(G.done){ROOM.phase='finishing'; roomSubmitWorth(); return}
 ROOM.phase='between'; ROOM.oppReady=false; ROOM.youReady=false;
 showQuarter(adv.res);
}
function roomContinue(){if(ROOM&&ROOM.phase==='between')ROOM.phase='play';priceFlash=true;draw()}
function roomSubmitWorth(){
 if(!ROOM||ROOM.worthSent||!G)return; ROOM.worthSent=true;
 roomFetch('/rooms/'+ROOM.code+'/worth',{token:ROOM.token,worth:E.worth(G),start:G.p.startCapital,cash:G.cash,units:G.units.length,debt:E.debt(G),holds:G.units.map(u=>{const z=E.zone(G,u.zone);return {name:z.name,price:z.cur}}),fee:E.ledger(G).saleFeeR}).then(roomApply).catch(()=>{ROOM.worthSent=false});
}
function showRoomWait(st){
 $('bar',''); $('modal','');
 const mine=st.worth&&st.worth[st.you];
 $('app',`<div class="card" id="duelend"><h3>Hết ván</h3><p>Đang chờ đối thủ gửi tài sản ròng.</p>${mine!=null?`<div class="row"><span>Bạn</span><b>${fmt(mine)}</b></div>`:''}</div>`);
}
function showRoomResult(st){
 if(!st||!st.winner)return;
 const you=st.you, other=you==='p1'?'p2':'p1';
 const sig=st.winner+':'+(st.worth.p1)+':'+(st.worth.p2)+':'+bookLine(st.books&&st.books.p1)+':'+bookLine(st.books&&st.books.p2);
 if(ROOM.resultSig===sig&&document.getElementById('duelresult'))return;
 ROOM.resultSig=sig;
 ROOM.phase='done'; if(ROOM_T){clearInterval(ROOM_T);ROOM_T=null}
 $('bar',''); $('modal',''); $('sheet','');
 const me=st.worth[you], opp=st.worth[other];
 const line=st.winner==='tie'?'Hòa':st.winner===you?'Bạn thắng':'Đối thủ thắng';
 $('app',`<div class="card" id="duelresult"><h3>Kết quả phòng ${esc(st.code)}</h3><p id="rwin"><b>${line}</b></p>
 <div class="row"><span>Bạn</span><b id="rwme">${fmt(me)}</b></div>
 <p class="note" id="rbme">${bookLine(st.books&&st.books[you])}</p>
 <div class="row"><span>Đối thủ</span><b id="rwopp">${fmt(opp)}</b></div>
 <p class="note" id="rbopp">${bookLine(st.books&&st.books[other])}</p>
 <div class="row"><span>Vốn đầu vào</span><b>${fmt(st.startCapital||G.p.startCapital)}</b></div>
 <p class="note">Người có tài sản ròng cao hơn thắng. Cùng tin, giá và lãi suất. Mỗi người một sổ.</p>
 <button class="ghost" onclick="start()">Về màn hình đầu</button></div>`);
}
function roomCommit(kind,a,b){
 if(!ROOM||!ROOM.token||!G||ROOM.phase==='wait')return;
 roomFetch('/rooms/'+ROOM.code+'/act',{token:ROOM.token,quarter:G.round,kind,a,b}).then(st=>{if(st&&st.phase)roomApply(st)}).catch(()=>{});
}
function drawLobby(){if(!ROOM)return;$('bar','');document.getElementById('bar').classList.remove('room');$('modal','');$('sheet','');
 const lock=ROOM.role==='join'||ROOM.players>=2;
 const pchips=lock?`<div class="rlock" id="rprojv">${esc(projShort(D.projects.find(p=>p.id===ROOM.project)||{name:ROOM.project}))}</div>`
  :D.projects.map(p=>`<button type="button" class="chipb${p.id===ROOM.project?' on':''}" onclick="roomPick('project','${p.id}')">${esc(projShort(p))}</button>`).join('');
 const lchips=lock?`<div class="rlock" id="rlenv">${ROOM.quarters} quý · ${ROOM.quarters/4} năm</div>`
  :lenOpts().map(q=>`<button type="button" class="chipb${q===ROOM.quarters?' on':''}" onclick="roomPick('quarters',${q})">${q} quý<small>${q/4} năm</small></button>`).join('');
 const ichips=lock?(()=>{const o=incOpts().find(x=>x.id===ROOM.income)||{label:ROOM.income};return `<div class="rlock" id="rincv">${esc(o.label)}</div>`})()
  :incOpts().map(o=>{const sub=o.id===(incR().defaultId)?'Hạn mức rộng':'';return `<button type="button" class="chipb${o.id===ROOM.income?' on':''}" onclick="roomPick('income','${o.id}')">${esc(o.label)}${sub?`<small>${sub}</small>`:''}</button>`}).join('');
 const incNote=incR().pickerNote?`<small class="note" id="rincnote">${esc(incR().pickerNote)}</small>`:'';
 const note=ROOM.role==='join'?'Bạn vào phòng này. Các lựa chọn do người tạo chọn, không đổi được. Cả hai dùng chung tin, giá và lãi suất. Mỗi người một sổ.'
  :(ROOM.players<2?'Đang chờ người thứ hai. Cả hai dùng chung tin, giá và lãi suất. Mỗi người một sổ.':'Đủ 2 người. Cả hai dùng chung tin, giá và lãi suất. Mỗi người một sổ.');
 const startBtn=ROOM.role==='host'
  ?`<button class="rstart" id="rstart" ${ROOM.players<2?'disabled':''} onclick="roomStart()">${ROOM.players<2?'Bắt đầu khi đủ 2 người':'Bắt đầu'}</button>`
  :`<button class="rstart" id="rstart" disabled>Chờ người tạo bắt đầu</button>`;
 $('app',`<div class="card" id="rlobby"><h3>Phòng đấu</h3>
 <div class="lab">Dự án</div><div class="chips" id="rproj">${pchips}</div>
 <div class="lab">Độ dài</div><div class="chips" id="rlen">${lchips}</div>
 <div class="lab">Thu nhập cả phòng</div><div class="chips" id="rinc">${ichips}</div>
 ${incNote}
 <div class="lab">Mã phòng</div><div class="rcode" id="rcode">${esc(ROOM.code)}</div>
 ${ROOM.role==='host'?`<div class="lab">Link mời</div><div class="rlink" id="rlinkbox">${esc(roomLink(ROOM.code))}</div><button type="button" class="alt rcopy" id="rcopy" onclick="copyRoomLink()">Sao chép link</button>`:''}
 <div class="note" id="rnote">${note}</div>
 ${startBtn}</div>`);
}
function roomPick(k,v){if(!ROOM||ROOM.role==='join'||ROOM.players>=2||ROOM.phase!=='lobby')return; ROOM[k]=v; drawLobby();
 roomFetch('/rooms/'+ROOM.code+'/settings',{token:ROOM.token,project:ROOM.project,quarters:ROOM.quarters,income:ROOM.income}).then(st=>{ROOM.sig='';roomApply(st)}).catch(()=>{})}
async function openDuel(){
 const api=roomApi(); if(!api){$('app',`<div class="card">Phòng đấu chưa mở trên trang này.</div>`);return}
 try{
  const st=await roomFetch('/rooms',{project:D.projects[0].id,quarters:getLen(),income:getInc()});
  ROOM={}; roomFrom(st,st.token); ROOM.phase='lobby'; ROOM.sig=''; drawLobby(); roomArm();
 }catch(e){$('app',`<div class="card" id="rerr">Không mở được phòng trên máy này.</div><button onclick="start()">Quay lại</button>`)}

function loanChart(F){const W=340,H=132,L=34,R=6,T=10,B=108,pts=F.path,n=pts.length,max=Math.max(1e-9,...pts.map(p=>p.bal));
 const x=i=>n<=1?L+8:L+(W-L-R)*i/(n-1),y=v=>B-(B-T)*(v/max),gi=Math.min(F.gameEndIndex,n-1);
 const seg=(a,b)=>pts.slice(a,b+1).map((p,k)=>(x(a+k).toFixed(1))+','+(y(p.bal).toFixed(1))).join(' ');
 const top=(max/1000).toLocaleString('vi-VN',{maximumFractionDigits:2});
 const nx=x(n-1),gx=x(gi),x0=x(0),near=gx-x0<54||nx-gx<64;
 const endLab=near?`<text x="${Math.min(W-4,Math.max(gx+2,L+2))}" y="${T+11}" text-anchor="${nx-gx<64?'end':'start'}" fill="#e7b84b" font-size="10">hết ván</text>`:`<text x="${gx-18}" y="124" fill="#e7b84b" font-size="10">hết ván</text>`;
 const nowLab=`<text x="${x0}" y="124" fill="#5c726c" font-size="10">nay</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="132" id="lfchart" aria-label="Dư nợ đến hết hạn">
 <line x1="${L}" y1="${T}" x2="${L}" y2="${B}" stroke="#c5d6ce"/><line x1="${L}" y1="${B}" x2="${W-4}" y2="${B}" stroke="#c5d6ce"/>
 <text x="1" y="12" fill="#5c726c" font-size="10">${top}</text><text x="18" y="${B}" fill="#5c726c" font-size="10">0</text>
 <polyline fill="none" stroke="#c2412d" stroke-width="2.4" points="${seg(0,gi)}"/>

 <line id="lfend" x1="${gx}" y1="${T}" x2="${gx}" y2="${B}" stroke="#e7b84b" stroke-dasharray="2 2"/>
 <circle cx="${gx}" cy="${y(pts[gi].bal)}" r="3.5" fill="#e7b84b"/>
 ${nowLab}${endLab}${n>1?`<text x="${W-4}" y="124" text-anchor="end" fill="#5c726c" font-size="10">năm ${F.termYears}</text>`:''}</svg>`}

 <div class="acts"><button id="buyok" class="bpgo" ${q.ok?'':'disabled'} onclick="confirmBuy()">Mua · trả trước ${fmt(q.down)}${q.loan?`<small>vay ${fmt(q.loan)}</small>`:''}</button><button class="alt" onclick="closeModal()">Thôi</button></div></div></div>`)}
function confirmBuy(){if(!BP||roomLocked())return;const o={ltvPct:BP.ltv,termYears:BP.term,pkgId:BP.pkg},id=BP.id;BP=null;$('modal','');let ok=true;if(G.duel)ok=E.duelAct(G,'buy',id,o);else E.buy(G,id,o);if(ok!==false&&G.duel)roomCommit('buy',id,o);draw()}
/* ---------- trả bớt nợ ---------- */
function askPrepay(uid){const u=E.unit(G,uid);if(!u||!u.loan)return;const bal=u.loan.bal,pct=E.penaltyPct(G,u),z=E.zone(G,u.zone);
 const b=(amt,label,cls)=>{const q=E.prepayQuote(G,uid,amt);return `<button class="${cls||'alt'}" data-amt="${Math.round(q.amount)}" ${q.ok?'':'disabled'} onclick="doPrepay(${uid},${amt})">${label}<small>cần ${fmt(q.total)} tiền mặt${q.penalty?` (gồm phạt ${fmt(q.penalty)})`:''}</small></button>`};
 $('modal',`<div class="modal rise" id="prep"><div class="card"><h3>💸 Trả bớt nợ</h3><p>${esc(z.name)}: dư nợ ${fmt(bal)}, đang góp ~${mTxt(E.quarterPreview(G,u).total/3)}/tháng. Phạt trả trước hạn ${pr(pct)} (năm vay thứ ${Math.floor(u.loan.m/12)+1}). Trả bớt thì tiền góp hằng tháng giảm.</p>
 <div class="acts col">${[200,500,1000].filter(x=>x<bal-0.5).map(x=>b(x,'Trả '+fmt(x))).join('')}${b(bal,'Tất toán '+fmt(bal),'')}<button class="ghost" onclick="closeModal()">Thôi</button></div></div></div>`)}
function doPrepay(uid,amt){if(roomLocked())return;$('modal','');let ok=true;if(G.duel)ok=E.duelAct(G,'prepay',uid,amt);else E.prepay(G,uid,amt);if(ok!==false&&G.duel)roomCommit('prepay',uid,amt);draw()}
function act(k,id){if(roomLocked())return;let ok=true;if(G.duel)ok=E.duelAct(G,k,id);else{if(k==='buy')E.buy(G,id);if(k==='sell')E.sell(G,id);if(k==='rent')E.rent(G,id)}if(ok!==false&&G.duel)roomCommit(k,id);draw()}
function choose(i){if(roomLocked())return;let ok=true;if(G.duel)ok=E.duelAct(G,'choose',i);else E.choose(G,i);if(ok!==false&&G.duel)roomCommit('choose',i);draw()}
function next(){if(ROOM&&ROOM.phase==='play'){sel=null;BP=null;LG=null;$('ledger','');$('loanfile','');$('sheet','');$('modal','');if(G.duel&&G.duel.pending)E.duelSheet(G,null);E.duelChot(G);ROOM.phase='wait';ROOM.youReady=true;draw();roomFetch('/rooms/'+ROOM.code+'/chot',{token:ROOM.token,quarter:G.round}).then(roomApply).catch(e=>{console.log('chotfail', e); window._roomErr=String(e)});return}if(ROOM&&(ROOM.phase==='wait'||ROOM.phase==='between'||ROOM.phase==='finishing'||ROOM.phase==='done'))return;sel=null;BP=null;LG=null;$('ledger','');$('loanfile','');$('sheet','');showQuarter(E.endQuarter(G))}
/* dòng tách lời/lỗ quý (engine tính sẵn trong r.breakdown, các phần đã làm tròn cộng lại đúng bằng số lớn), vd "−785 = giá −123 · lãi −242 · phát mãi −372 · phạt −48" */
const bn=n=>(n>0?'+':n<0?'\u2212':'')+Math.abs(n).toLocaleString('vi-VN');
function bdHTML(b){if(!b||!b.show)return '';const ps=b.parts;
 return `<div class="bd" id="pnlbd" data-total="${b.total}" data-parts="${esc(ps.map(x=>x.key+':'+x.rounded).join(','))}"><span>${bn(b.total)} =</span> ${ps.map((x,i)=>`<span>${x.label} ${bn(x.rounded)}${i<ps.length-1?' ·':''}</span>`).join(' ')}</div>`}
function showQuarter(r){const p=Math.round(r.pnl),zn=id=>esc(short(E.zone(G,id)));
 const pnl=`<div class="pnl" id="pnl"><small>Quý này bạn ${p>0?'lời':p<0?'lỗ':'hòa vốn'}</small><div class="big ${p>=0?'up':'down'}">${sgn(r.pnl)}</div>${r.quiet?'':bdHTML(r.breakdown)}<small class="sub">Tài sản ròng: ${fmt(r.worth-r.pnl)} → ${fmt(r.worth)} (gồm giá nhà, tiền thuê, lãi vay, lãi tiền gửi; tiền trả gốc không tính là lỗ)</small></div>`;
 const rentRow=(r.rent?`<div class="row"><span>Tiền thuê nhận</span><span class="up">+${fmt(r.rent)}</span></div>`:'')+
  (Math.round(r.depositInterest||0)>0?`<div class="row" id="deprow" data-v="${Math.round(r.depositInterest)}"><span>Lãi tiền gửi</span><span class="up">+${fmt(r.depositInterest)}</span></div>`:'')+(Math.round(r.lockInterest||0)>0?`<div class="row" id="lockirow"><span>Lãi khóa</span><span>cộng vào khoản khóa, không vào tiền mặt +${fmt(r.lockInterest)}</span></div>`:'');
 const pay=r.pay.total>0?`<div class="row" id="payrow" data-total="${Math.round(r.pay.total)}" data-p="${Math.round(r.pay.p)}" data-i="${Math.round(r.pay.i)}"><span>Trả góp ngân hàng</span><span class="down r">−${fmt(r.pay.total)}<br><small>gốc ${fmt(r.pay.p)}, lãi ${fmt(r.pay.i)}</small></span></div>`:'';
 const debt=E.debt(G),notes=r.promoEnds.map(x=>`<p class="note2 promo-end">⏰ <b>Hết ưu đãi:</b> lãi căn ${zn(x.zone)} tăng từ ${pr(x.from)} lên ${pr(x.to)}/năm từ quý sau.</p>`)
  .concat(r.baseEvent||(debt>0&&Math.abs(r.baseTo-r.baseFrom)>=0.1)?[`<p class="note2 base">🏦 Lãi cơ sở ngân hàng: ${pr(r.baseFrom)} → ${pr(r.baseTo)}/năm${r.baseEvent?' (theo tin quý này)':''}${debt>0?', áp dụng cho khoản vay đã hết ưu đãi từ quý sau':''}.</p>`]:[])
  .concat(r.fireSales.map(x=>`<p class="note2 firesale">🚨 <b>Không đủ tiền trả góp</b>, ngân hàng phát mãi căn ${zn(x.zone)}: bán ${fmt(x.price)} (thấp hơn thị trường ${G.M.fireSaleDiscountPct}%), trừ phí, trả nợ ${fmt(x.debt)}${x.penalty?` và phạt trả trước ${fmt(x.penalty)}`:''}, bạn còn nhận ${fmt(x.net)}.</p>`))
  .concat(G.cash<0?[`<p class="note2 firesale">⚠️ Tiền mặt đang âm ${fmt(-G.cash)}: bán các căn còn lại cũng không đủ trả nợ ngân hàng. Hãy bán bớt hoặc cho thuê để bù.</p>`]:[])
  .concat(r.ltvCap?[`<p class="note2 base">🏦 Ngân hàng hạ tỷ lệ cho vay tối đa còn ${r.ltvCap.pct}% giá căn cho khoản vay mới, trong ${r.ltvCap.until-r.round} quý tới.</p>`]:[]).join('');
 const btn=`<button id="qnext" style="margin-top:10px;width:100%" onclick="goOn()">${G.done?'Xem kết quả':r.quiet?'Tiếp ▶':'Sang quý '+G.round+' ▶'}</button>`;
 $('bar','');
 if(r.quiet){$('modal',`<div class="modal rise"><div class="card compact" id="qpop">${pnl}<p class="one">${r.truth?'✅':'❌'} ${esc(r.ev.text)} <small>(tin ${r.truth?'thật':'giả'})</small></p><p class="zl" id="qzl">${G.zones.map((z,i)=>`<span class="${chc(z.last)}">${esc(short(z))} ${flat(z.last)?'đứng giá':sp(z.last)}${i<G.zones.length-1?' ·':''}</span>`).join(' ')}</p>${rentRow}${pay}${notes}${btn}</div></div>`);return}
 $('modal',`<div class="modal rise"><div class="card" id="qpop">${pnl}
 <h3>${r.truth?'✅ Tin là THẬT':'❌ Tin là GIẢ'}</h3><p style="opacity:.85">${r.ev.text}<br><small>Nguồn: ${r.ev.source||''}</small></p>
 ${G.zones.map(z=>`<div class="row"><span>${z.name}</span><span class="${chc(z.last)}">${pc(z.last)}</span></div>`).join('')}
 ${rentRow}${pay}${notes}${btn}</div></div>`)}
const sp=n=>(n>=0?'+':'\u2212')+Math.abs(n).toFixed(1).replace('.',',')+'%';
/* so với gửi tiết kiệm: tiền mặt trong game cũng hưởng lãi này (engine v3.5) nên so sánh công bằng */
function saveBench(){const c=depOn();if(c){const o=(c.options||[]).find(x=>x.termQuarters===4);return o?{d:+o.ratePctYear,name:'khóa 4 quý'}:null}const d=(D.rules||{}).deposit12mPctYear;return d==null?null:{d,name:'gửi tiết kiệm'}}
function vsSave(ann){const b=saveBench();if(!b)return null;const x=Math.round((ann-b.d)*10)/10,v=Math.abs(x).toFixed(1).replace('.',',');
 return {txt:x>0?`Hơn ${b.name} ${pr(b.d)}/năm: +${v} điểm/năm`:x<0?`Kém ${b.name} ${pr(b.d)}/năm: \u2212${v} điểm/năm`:`Ngang ${b.name} ${pr(b.d)}/năm`,up:x>=0}}
function goOn(){if(G.done){end();return}priceFlash=true;if(ROOM){roomContinue();return}draw()}
function end(){sel=null;BP=null;$('sheet','');$('modal','');$('bar','');if(!G._fin){G._fin=1;track('finish',{q:G.totalQ})}const R=E.result(G),t=R.title,pct=R.profitPct,ann=R.annualPct;
 const best=parseFloat(localStorage.bdsBestAnn||'-1e9');if(ann>best)localStorage.bdsBestAnn=ann.toFixed(1);
 const c=D.cta||{};
 $('app',`<canvas id="cv" width="1080" height="1080" style="width:100%;border-radius:14px;margin-top:8px"></canvas>
 ${(l=>`<div class="card lesson" id="lesson" data-key="${l.key}"><i>💡</i><span>${esc(l.text)}</span></div>`)(E.lesson(G))}
 ${ROOM?`<div class="card" id="duelend">Người có tài sản ròng cao hơn thắng. Vốn đầu vào bằng nhau (${fmt(G.p.startCapital)}).</div>`:''}<div class="card"><div class="row"><span>Tài sản ròng cuối ván</span><b>${fmt(R.worth)}</b></div><div class="row"><span>Số giao dịch</span><b>${R.trades}</b></div><div class="row"><span>Tiền thuê đã nhận</span><b>${fmt(G.stats.rent)}</b></div>${depOn()||(D.rules||{}).deposit12mPctYear!=null?`<div class="row"><span>Lãi tiền gửi đã nhận</span><b id="rdep">${fmt(R.depositInterest)}</b></div>`:''}${depOn()&&G.stats.lockInterest>0.5?`<div class="row"><span>Lãi khóa, cộng vào khoản khóa</span><b id="rlock">${fmt(G.stats.lockInterest)}</b></div>`:''}
 <div class="row"><span>Lãi ngân hàng đã trả</span><b id="rint">${fmt(R.interestPaid)}</b></div>${R.penalties>0?`<div class="row"><span>Phạt trả nợ trước hạn</span><b>${fmt(R.penalties)}</b></div>`:''}
 <div class="row"><span>Dư nợ còn lại</span><b id="rdebt">${fmt(R.debt)}</b></div>${R.fireSales?`<div class="row"><span>Căn bị ngân hàng phát mãi</span><b class="down">${R.fireSales}</b></div>`:''}
 ${R.income?`<div class="row"><span>Thu nhập kê khai (xét vay)</span><b id="rinc">${esc(R.income.label)}/tháng</b></div>`:''}<div class="row"><span>Đoán đúng hướng tin</span><b>${Math.round(R.rumorCallPct)}%</b></div></div>
 <a id="zalo" href="${c.zaloUrl||'#'}" target="_blank" rel="noopener" onclick="track('zalo')"><button style="width:100%;font-size:1.15em;padding:14px">${c.label||'Nhắn Zalo tư vấn'}</button></a>
 <div style="text-align:center;margin-top:6px"><button class="ghost" onclick="share()">Chia sẻ</button><button class="ghost" onclick="saveImg()">Tải ảnh</button>${c.formUrl?`<a href="${c.formUrl}" target="_blank" rel="noopener"><button class="ghost">Để lại thông tin</button></a>`:''}<button class="ghost" id="replay" onclick="track('replay');start()">Chơi lại</button></div>
 <p class="warn">${D.disclaimer||''}</p>`);drawCard(t,pct,ann);window._res={t,pct,ann}}
function drawCard(t,pct,ann){const c=document.getElementById('cv'),x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,1080,1080);g.addColorStop(0,'#f4f7f4');g.addColorStop(1,'#ffffff');x.fillStyle=g;x.fillRect(0,0,1080,1080);
 x.fillStyle='#e7b84b';x.fillRect(80,80,920,8);x.textAlign='center';x.fillStyle='#142824';
 x.font='600 44px system-ui';x.fillText('VÁN ĐẦU TƯ',540,200);x.font='36px system-ui';x.fillText(G.p.name,540,260);
 x.fillStyle='#142824';x.font='bold 84px system-ui';wrap(x,t.name,540,440,900,96);
 x.fillStyle='#142824';x.font='40px system-ui';wrap(x,t.desc,540,620,880,52);
 x.font='bold 120px system-ui';x.fillStyle=pct>=0?'#1f7a45':'#c2412d';x.fillText(sp(pct),540,840);
 x.fillStyle='#142824';x.font='38px system-ui';x.fillText(`sau ${G.totalQ} quý · ≈ ${sp(ann)}/năm`,540,900);
 const vs=vsSave(ann);if(vs){x.font='600 34px system-ui';x.fillStyle=vs.up?'#1f7a45':'#c2412d';x.fillText(vs.txt,540,952);x.fillStyle='#142824'}
 x.font='30px system-ui';x.fillText('Bạn là nhà đầu tư kiểu gì? Chơi thử ngay!',540,1005);x.font='22px system-ui';x.globalAlpha=.7;x.fillText('Game mô phỏng, giá và lãi suất không phải số thật',540,1045);x.globalAlpha=1}
function wrap(x,t,cx,y,w,lh){const ws=t.split(' ');let l='',ls=[];ws.forEach(v=>{const tt=l?l+' '+v:v;if(x.measureText(tt).width>w){ls.push(l);l=v}else l=tt});ls.push(l);ls.forEach((v,i)=>x.fillText(v,cx,y+i*lh))}
function saveImg(){const a=document.createElement('a');a.download='van-dau-tu.png';a.href=document.getElementById('cv').toDataURL('image/png');a.click()}
async function share(){const {t,pct,ann}=window._res,txt=`Mình là "${t.name}" (${sp(pct)} sau ${G.totalQ} quý, ≈ ${sp(ann)}/năm${(v=>v?', '+v.txt.toLowerCase():'')(vsSave(ann))}) trong game Ván đầu tư! Bạn là nhà đầu tư kiểu gì?`;
 try{const b=await new Promise(r=>document.getElementById('cv').toBlob(r));const f=new File([b],'ket-qua.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],text:txt+' '+location.href});
  if(navigator.share)return navigator.share({title:'Ván đầu tư',text:txt,url:location.href})}catch(e){}
 navigator.clipboard.writeText(txt+' '+location.href);alert('Đã sao chép nội dung chia sẻ!')}
load().then(async()=>{
 let code='';
 try{code=(new URLSearchParams(location.search).get('phong')||'').replace(/\D/g,'')}catch(e){}
 if(code.length===4&&roomApi()){
  try{
   const st=await roomFetch('/rooms/'+code+'/join',{});

   return;
  }catch(e){

   start();
   const app=document.getElementById('app');
   if(app)app.insertAdjacentHTML('afterbegin','<div class="card" id="rerr">'+esc(msg)+'</div>');

 }
 start();
