  <text x="535" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#6D4C41">Phòng ngủ 2</text>
  <text x="350" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#A1887F">Không phải mặt bằng bán hàng chính thức</text>
