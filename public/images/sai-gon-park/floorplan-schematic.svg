<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-label="Townhouse floorplan schematic">
  <rect width="700" height="500" fill="#FFF8E1"/>
