<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Apartment skyline schematic">
  <rect width="800" height="500" fill="#E1F5FE"/>
  <rect y="350" width="800" height="150" fill="#A5D6A7"/>
  <rect x="100" y="120" width="90" height="230" fill="#78909C"/>
  <rect x="210" y="80" width="110" height="270" fill="#546E7A"/>
  <rect x="340" y="100" width="100" height="250" fill="#607D8B"/>
  <rect x="460" y="60" width="120" height="290" fill="#455A64"/>
  <rect x="600" y="140" width="100" height="210" fill="#78909C"/>
  <!-- windows -->
  <g fill="#BBDEFB">
    <rect x="115" y="140" width="20" height="20"/><rect x="145" y="140" width="20" height="20"/>
    <rect x="115" y="180" width="20" height="20"/><rect x="145" y="180" width="20" height="20"/>
    <rect x="230" y="100" width="25" height="25"/><rect x="270" y="100" width="25" height="25"/>
    <rect x="230" y="150" width="25" height="25"/><rect x="270" y="150" width="25" height="25"/>
    <rect x="480" y="90" width="30" height="25"/><rect x="530" y="90" width="30" height="25"/>
  </g>
  <text x="400" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#01579B" font-weight="bold">Căn hộ cao tầng (trong quy hoạch)</text>
  <text x="400" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#546E7A">Schematic · chưa khẳng định mở bán/giá chính thức</text>
</svg>