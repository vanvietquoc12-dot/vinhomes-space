<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Payment flow diagram">
  <rect width="900" height="360" fill="#F3E5F5"/>
  <text x="450" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#4A148C" font-weight="bold">Dòng tiền giãn xây (minh họa khái niệm)</text>
  <rect x="40" y="100" width="240" height="120" rx="10" fill="#CE93D8"/>
  <text x="160" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#4A148C" font-weight="bold">Phần đất + TM</text>
  <text x="160" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#6A1B9A">Thanh toán sớm</text>
  <path d="M290 160 L350 160" stroke="#6A1B9A" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="360" y="100" width="200" height="120" rx="10" fill="#E1BEE7"/>
  <text x="460" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#4A148C" font-weight="bold">Quãng nghỉ</text>
  <text x="460" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#6A1B9A">~ tới D+540</text>
  <path d="M570 160 L630 160" stroke="#6A1B9A" stroke-width="3"/>
  <rect x="640" y="100" width="220" height="120" rx="10" fill="#AB47BC"/>
  <text x="750" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold">Phần xây dựng</text>
  <text x="750" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#F3E5F5">Thanh toán sau</text>
  <text x="450" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6A1B9A">Không phải lịch thanh toán chính thức — đọc phụ lục HĐMB</text>
  <text x="450" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#9C27B0">Chiết khấu/vay thường tính trên phần đất+TM, không phải tổng giá</text>
</svg>