<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Five park zones schematic">
  <rect width="1000" height="420" fill="#F5F5F5"/>
  <text x="500" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#212121" font-weight="bold">5 phân khu (theo tài liệu giới thiệu)</text>
  <g font-family="Arial,sans-serif" font-size="13" text-anchor="middle">
    <rect x="30" y="80" width="170" height="260" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="115" y="130" font-weight="bold" fill="#0D47A1">Ivy Park</text>
    <text x="115" y="155" fill="#455A64">Công viên</text>
    <text x="115" y="175" fill="#455A64">Tri Thức</text>
    <text x="115" y="210" fill="#78909C">Đang mở bán*</text>
    
    <rect x="220" y="80" width="170" height="260" rx="10" fill="#FCE4EC" stroke="#C2185B" stroke-width="2"/>
    <text x="305" y="130" font-weight="bold" fill="#880E4F">Global Park</text>
    <text x="305" y="155" fill="#455A64">Công viên</text>
    <text x="305" y="175" fill="#455A64">Quốc Tế</text>
    <text x="305" y="210" fill="#78909C">Đang mở bán*</text>
    
    <rect x="410" y="80" width="170" height="260" rx="10" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
    <text x="495" y="130" font-weight="bold" fill="#006064">Laguna Park</text>
    <text x="495" y="155" fill="#455A64">Công viên</text>
    <text x="495" y="175" fill="#455A64">Biển Xanh</text>
    <text x="495" y="210" fill="#78909C">Chưa mở bán*</text>
    
    <rect x="600" y="80" width="170" height="260" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
    <text x="685" y="130" font-weight="bold" fill="#4A148C">Zen Park</text>
    <text x="685" y="155" fill="#455A64">Công viên</text>
    <text x="685" y="175" fill="#455A64">Thiền</text>
    <text x="685" y="210" fill="#78909C">Chưa mở bán*</text>
    
    <rect x="790" y="80" width="170" height="260" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="875" y="130" font-weight="bold" fill="#1B5E20">Golf Park</text>
    <text x="875" y="155" fill="#455A64">Công viên</text>
    <text x="875" y="175" fill="#455A64">Golf</text>
    <text x="875" y="210" fill="#78909C">Chưa mở bán*</text>
  </g>
  <text x="500" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#757575">* Trạng thái theo nguồn thứ cấp tháng 9/2026 — cần đối chiếu lại</text>
</svg>