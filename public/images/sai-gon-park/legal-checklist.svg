    <rect x="80" y="330" width="540" height="50" rx="8" fill="#C5CAE9"/>
    <text x="110" y="360">☐ Đối chiếu QHCT 1/500 &amp; mặt bằng căn?</text>
  </g>
  <text x="350" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#5C6BC0">Minh họa biên tập · không thay thế tư vấn pháp lý</text>
</svg>